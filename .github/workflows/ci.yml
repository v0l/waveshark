name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure costs nothing and saves a round trip.
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librtlsdr-dev liblimesuite-dev pkg-config libclang-dev \
            libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        # Release: several tests assert throughput against real time, and a
        # debug build misses those by a wide enough margin to be meaningless.
        run: cargo test --workspace --release

      - name: Build with no radio attached
        run: cargo build --workspace --release --all-targets

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The changelog has to have the shape the release job reads: an
      # Unreleased section to release from, and a section for the version
      # in Cargo.toml once it has been tagged.
      - name: CHANGELOG.md has an Unreleased section
        run: grep -q '^## \[Unreleased\]' CHANGELOG.md
      - name: A tagged version has its section
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if git tag --list "v$v" | grep -q .; then
            tools/changelog.sh check "$v"
          fi
