name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: --no-default-features --features limesdr,stt
          # Apple silicon only. The Intel runners are on their way out and
          # nobody has an Intel Mac to check the result on, and a binary
          # nobody has started is not a release asset.
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features --features limesdr,stt
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            features: --no-default-features --features stt

    steps:
      - uses: actions/checkout@v4

      # Built on the oldest runner image available so the glibc the binary
      # needs is older than the one on the machine running it. Building on
      # latest produces something that will not start on a stable distribution.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librtlsdr-dev liblimesuite-dev pkg-config libclang-dev \
            libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # Both -sys crates find their headers through pkg-config, and Homebrew
      # installs the .pc files where its own pkg-config looks, so nothing has
      # to be pointed at by hand the way it does on Windows.
      - name: macOS libraries
        if: runner.os == 'macOS'
        run: brew install librtlsdr limesuite pkg-config

      # rtlsdr-sys takes an explicit path in preference to pkg-config, which is
      # the way in on Windows: vcpkg ships the library and headers but getting
      # pkg-config itself working under MSVC is a job of its own.
      - name: Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install rtlsdr:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "RTLSDR_LIB_DIR=$root\lib"         | Out-File -Append $env:GITHUB_ENV
          "RTLSDR_INCLUDE_DIR=$root\include" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_BIN=$root\bin"              | Out-File -Append $env:GITHUB_ENV
          # bindgen needs libclang, which is present on the runner but not on
          # a path it looks in by itself.
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Every job names its features rather than taking the defaults. A build
      # from source has TETRA decryption and the AMBE vocoder on, and neither
      # goes into a published binary: the cipher and the vocoder are things a
      # person may compile for themselves and not things this project ships.
      # LimeSuite has no vcpkg port either, so the Windows binary is built
      # without the LimeSDR driver, which only means the device never appears
      # in the list.
      # Locked: the lock file is the set of versions this has been built with,
      # and a resolver free to pick a newer one has picked a crate needing a
      # compiler newer than the job has. That failure reads as "unstable
      # feature" in a dependency nobody here wrote.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p app ${{ matrix.features }}

      - name: Stage (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/waveshark stage/
          cp README.md LICENSE* stage/ 2>/dev/null || true
          # The desktop entry a Linux user writes points at an icon file, so
          # the archive carries one.
          cp assets/logo/waveshark-icon.png stage/ 2>/dev/null || true
          cat > stage/RUNNING.txt <<'EOF'
          waveshark links librtlsdr at run time rather than bundling it,
          because the copy that matches your udev rules and your USB stack is
          the one already on your machine.

            Debian/Ubuntu   sudo apt install librtlsdr0 libasound2
            Fedora          sudo dnf install rtl-sdr alsa-lib
            Arch            sudo pacman -S rtl-sdr alsa-lib
            macOS           brew install librtlsdr limesuite

          Verified against the built binary, which links librtlsdr.so.0,
          libasound.so.2 and libusb-1.0.so.0 and nothing else out of the
          ordinary. The macOS build is linked against Homebrew's librtlsdr
          and LimeSuite, so both have to be installed for it to start.

          On Linux a plain user needs permission to claim the device. The
          rtl-sdr package usually installs the udev rules that grant it; if
          the radio is only visible as root, that is what is missing.

          On macOS the binary is not signed or notarised, so Gatekeeper
          refuses it on the first run. Clear the download flag once:

            xattr -dr com.apple.quarantine waveshark
          EOF
          tar -C stage -czf waveshark-${{ matrix.name }}.tar.gz .

      # The DLLs go in the zip: there is no system package to point a Windows
      # user at, so an executable on its own would not start.
      - name: Stage (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\waveshark.exe" stage\
          Copy-Item "$env:VCPKG_BIN\*.dll" stage\ -ErrorAction SilentlyContinue
          Copy-Item README.md stage\ -ErrorAction SilentlyContinue
          Copy-Item assets\logo\waveshark-icon.png stage\ -ErrorAction SilentlyContinue
          @"
          Plug the radio in before starting waveshark.

          Windows needs WinUSB bound to the device rather than the DVB-T
          driver it ships with. Use Zadig (https://zadig.akeo.ie) and replace
          the driver on the RTL2832U interface with WinUSB. Without this the
          device enumerates but cannot be opened.
          "@ | Out-File -Encoding utf8 stage\RUNNING.txt
          Compress-Archive -Path stage\* -DestinationPath waveshark-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: waveshark-${{ matrix.name }}
          path: |
            waveshark-*.tar.gz
            waveshark-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The release notes are the changelog's section for this version, and
      # a tag with no section is a mistake to stop on rather than release
      # with a generated list of commit subjects.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          tools/changelog.sh check "$v"
          tools/changelog.sh notes "$v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
