name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No ffmpeg: this image's is 4.4 and ffmpeg-sys wants 5.1 or newer,
          # and a newer image would link a soname the machine running the
          # binary has to have as well. So a released Linux binary decodes a
          # multiplex and shows no pictures; a build from source shows them.
          # CUDA is in the build rather than beside it. The patched candle in
          # the root manifest loads the CUDA libraries at run time, so this
          # one binary starts on a machine with no card and says it has no
          # device; with a card and the CUDA 12 runtime it reads speech on
          # the GPU. The toolkit is needed to build the kernels, not to run
          # them.
          #
          # No ffmpeg: this image's is 4.4 and ffmpeg-sys wants 5.1 or newer,
          # and a newer image would link a soname the machine running the
          # binary has to have as well. So a released Linux binary decodes a
          # multiplex and shows no pictures; a build from source shows them.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: --no-default-features --features limesdr,stt,cuda,mcp
            cuda: '12.8.1'
            installers: deb,rpm
          # Apple silicon only. The Intel runners are on their way out and
          # nobody has an Intel Mac to check the result on, and a binary
          # nobody has started is not a release asset. No CUDA here: a Mac
          # reads speech on Metal, which `stt` turns on by itself.
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features --features limesdr,stt,mcp,ffmpeg
            installers: dmg
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            features: --no-default-features --features stt,cuda,mcp
            cuda: '12.8.1'
            installers: msi

    steps:
      - uses: actions/checkout@v4

      # Built on the oldest runner image available so the glibc the binary
      # needs is older than the one on the machine running it. Building on
      # latest produces something that will not start on a stable distribution.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librtlsdr-dev liblimesuite-dev pkg-config libclang-dev \
            libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      # Both -sys crates find their headers through pkg-config, and Homebrew
      # installs the .pc files where its own pkg-config looks, so nothing has
      # to be pointed at by hand the way it does on Windows.
      - name: macOS libraries
        if: runner.os == 'macOS'
        run: brew install librtlsdr limesuite pkg-config ffmpeg

      # rtlsdr-sys takes an explicit path in preference to pkg-config, which is
      # the way in on Windows: vcpkg ships the library and headers but getting
      # pkg-config itself working under MSVC is a job of its own.
      - name: Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install rtlsdr:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "RTLSDR_LIB_DIR=$root\lib"         | Out-File -Append $env:GITHUB_ENV
          "RTLSDR_INCLUDE_DIR=$root\include" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_BIN=$root\bin"              | Out-File -Append $env:GITHUB_ENV
          # bindgen needs libclang, which is present on the runner but not on
          # a path it looks in by itself.
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      # The toolkit, where the job builds for a card. Network on Linux
      # installs only the packages named; the Windows installer takes
      # component names instead. The runner has no card, so the compute
      # capability is given: 8.0 is Ampere, and PTX for it is finished by
      # the driver on anything since. Not 7.5: candle's shim for pre-Ampere
      # half precision collides with the same functions in CUDA 12.8's own
      # headers, and the build stops in compatibility.cuh.
      - uses: Jimver/cuda-toolkit@v0.2.36
        if: matrix.cuda && runner.os == 'Linux'
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl", "crt", "nvrtc-dev", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcurand-dev"]'
          log-file-suffix: '${{ matrix.name }}.txt'
      - uses: Jimver/cuda-toolkit@v0.2.36
        if: matrix.cuda && runner.os == 'Windows'
        with:
          cuda: ${{ matrix.cuda }}
          method: local
          # Windows names differ from Linux's and the installer refuses the
          # whole list over one it does not know: there is no cccl package
          # here, its headers come with nvcc, and nvrtc_dev has an underscore.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
          log-file-suffix: '${{ matrix.name }}.txt'
      - name: Compute capability for the kernels
        if: matrix.cuda
        shell: bash
        run: echo "CUDA_COMPUTE_CAP=80" >> "$GITHUB_ENV"
      # nvcc drives cl.exe, which the runner has but does not put on the
      # PATH until a developer shell is opened.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.cuda && runner.os == 'Windows'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Every job names its features rather than taking the defaults. A build
      # from source has TETRA decryption and the AMBE vocoder on, and neither
      # goes into a published binary: the cipher and the vocoder are things a
      # person may compile for themselves and not things this project ships.
      # LimeSuite has no vcpkg port either, so the Windows binary is built
      # without the LimeSDR driver, which only means the device never appears
      # in the list. Only the macOS job links ffmpeg, where Homebrew has a
      # new enough one; the others show no pictures off a multiplex.
      # Locked: the lock file is the set of versions this has been built with,
      # and a resolver free to pick a newer one has picked a crate needing a
      # compiler newer than the job has. That failure reads as "unstable
      # feature" in a dependency nobody here wrote.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p app ${{ matrix.features }}

      # A release carries files, not folders: the installer for the platform,
      # and the binary itself for anyone who would rather not install one.
      # Windows needs its two vcpkg DLLs beside the .exe, so those are assets
      # of their own; everything else a folder used to carry is in the README.
      - name: Binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/waveshark waveshark-${{ matrix.name }}
          chmod +x waveshark-${{ matrix.name }}

      - name: Binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\waveshark.exe" waveshark-${{ matrix.name }}.exe
          Copy-Item "$env:VCPKG_BIN\rtlsdr.dll" .
          Copy-Item "$env:VCPKG_BIN\libusb-1.0.dll" .

      # The installers, built from the metadata in crates/app/Cargo.toml after
      # the binary is copied out and never before it: the macOS step rewrites
      # the binary to look for its libraries inside the bundle, and the copy
      # published on its own has to be the one that reads them from Homebrew.
      # cargo-packager has no RPM, so that one package comes from
      # cargo-generate-rpm reading the same manifest. Both tools are
      # downloaded rather than compiled, and pinned, so a release is made with
      # the packager it was tested with.
      - uses: cargo-bins/cargo-binstall@main
        if: matrix.installers
      - name: Packaging tools
        if: matrix.installers
        shell: bash
        run: |
          cargo binstall --no-confirm cargo-packager@0.11.8
          case '${{ matrix.installers }}' in
            *rpm*) cargo binstall --no-confirm cargo-generate-rpm@0.21.0 ;;
          esac

      - name: Installers (linux)
        if: runner.os == 'Linux' && matrix.installers
        shell: bash
        run: |
          cargo packager -p app -r --target ${{ matrix.target }} -f deb -o "$PWD/dist"
          mv dist/*.deb waveshark-${{ matrix.name }}.deb
          # The RPM names Fedora's packages rather than what ldd found on this
          # Debian runner, which is why its dependencies are written out.
          #
          # RPM reads a hyphen as the separator before the release number and
          # refuses one in a version, so 0.3.1-rc1 is 0.3.1~rc1 here, which is
          # the same thing in RPM's ordering: a tilde sorts below the release
          # it leads to.
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "app") | .version')
          cargo generate-rpm -p crates/app --target ${{ matrix.target }} \
            -s "version = '${ver//-/\~}'" \
            -o waveshark-${{ matrix.name }}.rpm

      - name: Installers (macos)
        if: runner.os == 'macOS' && matrix.installers
        env:
          # Ad-hoc. Apple silicon kills a binary whose signature does not
          # match its contents, and rewriting the load paths below changes
          # them; nothing here is notarised, so this only gets it started.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          brew install dylibbundler
          mkdir -p dist-extra
          dylibbundler -of -b -x target/${{ matrix.target }}/release/waveshark \
            -d dist-extra -p @executable_path/../Resources/
          cargo packager -p app -r --target ${{ matrix.target }} -f app -o "$PWD/dist"
          codesign --force --deep --sign - dist/WaveShark.app
          cargo packager -p app -r --target ${{ matrix.target }} -f dmg -o "$PWD/dist"
          mv dist/*.dmg waveshark-${{ matrix.name }}.dmg

      - name: Installers (windows)
        if: runner.os == 'Windows' && matrix.installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-extra | Out-Null
          Copy-Item "$env:VCPKG_BIN\*.dll" dist-extra\ -ErrorAction SilentlyContinue
          cargo packager -p app -r --target ${{ matrix.target }} -f wix -o "$PWD\dist"
          Move-Item dist\*.msi waveshark-${{ matrix.name }}.msi

      - uses: actions/upload-artifact@v4
        with:
          name: waveshark-${{ matrix.name }}
          path: |
            waveshark-${{ matrix.name }}
            waveshark-${{ matrix.name }}.exe
            waveshark-${{ matrix.name }}.deb
            waveshark-${{ matrix.name }}.rpm
            waveshark-${{ matrix.name }}.msi
            waveshark-${{ matrix.name }}.dmg
            rtlsdr.dll
            libusb-1.0.dll
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The release notes are the changelog's section for this version, and
      # a tag with no section is a mistake to stop on rather than release
      # with a generated list of commit subjects.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          tools/changelog.sh check "$v"
          tools/changelog.sh notes "$v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          # A tag with a suffix is a release candidate, and the update check
          # asks GitHub for the latest release, which skips these. So an rc
          # can be published and installed without offering itself to anybody
          # running the last real one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/waveshark-*
            artifacts/rtlsdr.dll
            artifacts/libusb-1.0.dll
