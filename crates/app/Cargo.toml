[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A software defined radio receiver that decodes what it hears"
homepage = "https://github.com/v0l/waveshark"
repository = "https://github.com/v0l/waveshark"

[[bin]]
name = "waveshark"
path = "src/main.rs"

# Only Windows reads an icon out of the executable itself; the crate is a
# no-op elsewhere and the build script does not call it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Only to attach to the console that started us, since a windows-subsystem
# binary has none of its own and `--help` would otherwise print into space.
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[dependencies]
eframe = "0.35"
rayon.workspace = true
egui = "0.35"
egui-phosphor = { version = "0.13", default-features = false, features = ["regular"] }

common.workspace = true
dsp.workspace = true
audio.workspace = true
rtlsdr.workspace = true
hackrf.workspace = true
limesdr = { workspace = true, optional = true }
remote.workspace = true
sources.workspace = true
nodes.workspace = true
iqstream.workspace = true
gps.workspace = true
survey.workspace = true
orbit.workspace = true
decode.workspace = true
datasets.workspace = true
pipeline.workspace = true
crossbeam-channel.workspace = true
stt = { workspace = true, optional = true }
tts = { workspace = true, optional = true }
chrono.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
libc = "0.2"
zstd = { version = "0.13", default-features = false }
# The call log's codec. Pure Rust, so a release build needs no C toolchain
# and no system libopus.
opus-rs = "0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
poll-promise = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "net"] }
# Driving the receiver from an agent: MCP over streamable HTTP, served from
# inside the running interface. Optional, since a receiver nobody is
# automating should not carry an HTTP stack.
rmcp = { version = "3.2", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
], optional = true }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
], optional = true }
# Tool argument schemas, which both the MCP server and the chat in the Agent
# view publish, so this is not tied to the server being built.
schemars = "1"
base64 = "0.22"
# Gzip for the heatmap export: the readings are mostly a noise floor and a
# lot of unread axis, which deflate takes to a fraction of their size.
flate2 = "1.1"
reqwest.workspace = true
csv.workspace = true
httpc.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
hound = "3"

[features]
# LimeSuite is not packaged everywhere, and there is no vcpkg port of it, so
# the Windows build is made without this. Everything else here works with the
# driver absent: the device simply never appears in the list.
default = ["limesdr", "stt", "tts", "cuda", "tea", "ambe", "mcp", "ffmpeg"]
# Pictures off a broadcast multiplex, through the system ffmpeg libraries.
# On by default; a build without it decodes the transport stream and its
# tables and shows no picture.
ffmpeg = ["nodes/ffmpeg"]
# The MCP server behind --mcp-listen, which hands an agent the same receiver
# the operator is looking at. On by default and shipped in the release
# binaries: nothing listens until an address is given on the command line.
mcp = ["dep:rmcp", "dep:axum"]
limesdr = ["dep:limesdr"]
# TETRA decryption and key recovery. On in a build from source, since a Keys
# view that can only watch is half a receiver, and off in the binaries the
# release workflow publishes.
tea = ["nodes/tea", "decode/tea"]
# DMR speech decode through the AMBE vocoder. Same as `tea`: built from
# source, not shipped, because the vocoder is patent-encumbered and what a
# person compiles for themselves is not what a project distributes.
ambe = ["nodes/ambe"]
# Transcribe decoded speech with a local Whisper model. On by default: a
# scanner that cannot tell you what was said is missing the point of a voice
# channel. The stage is switched off until a model directory exists, so a
# build with no model costs a node that copies packets. Turn it off with
# --no-default-features to keep candle and the tokenizer out of the build.
stt = ["nodes/stt", "dep:stt"]
# Speak the agent's replies with a model on this machine rather than a speech
# server. On by default in a build from source; the first time the agent is
# asked to talk on the air it fetches about 330 MB of model, voice and
# pronunciation dictionary. A build without it can still use a speech server.
tts = ["dep:tts"]
# Run the speech model on a CUDA card. On by default and in every published
# binary: the patched candle in the workspace manifest loads the CUDA
# libraries when a device is first asked for, so a build with this on starts
# on a machine with no card and reads speech on the CPU. Building it needs the
# CUDA toolkit on the path; running it does not. It matters because the model
# on a CPU keeps up with one handheld and not a repeater. Nothing on a Mac,
# which gets Metal whenever `stt` is on.
cuda = ["stt?/cuda", "tts?/cuda"]

# The installers the release publishes, built by `cargo packager` after the
# binary. Paths are relative to this file, as build.rs's icon already is.
#
# `dist-extra` is the one staging directory the workflow fills with whatever a
# platform cannot link from the machine it runs on: on macOS the Homebrew
# dylibs that dylibbundler has already rewritten the binary to look for, plus
# LimeSuite, which is opened by name at run time. It is empty on Linux and
# Windows: the RTL-SDR is driven by the tree's own USB driver, and ALSA comes
# from the package `deb.depends` names.
[package.metadata.packager]
product-name = "WaveShark"
identifier = "io.github.v0l.waveshark"
publisher = "WaveShark"
authors = ["v0l <kieran@harkin.me>"]
category = "Utility"
license-file = "../../LICENSE"
icons = [
    "../../assets/logo/waveshark-icon.png",
    "../../assets/logo/waveshark-icon.ico",
]
resources = [{ src = "../../dist-extra/*", target = "" }]

[package.metadata.packager.deb]
# Not the product name kebab-cased, which would be `wave-shark`.
package-name = "waveshark"
section = "hamradio"
# What the binary links and does not carry: libasound2 only. A release build
# has no ffmpeg, LimeSuite is opened by name at run time and the RTL-SDR is
# driven by the tree's own USB driver, so none of those is named here.
depends = ["libasound2 | libasound2t64"]

[package.metadata.generate-rpm]
name = "waveshark"
assets = [
    { source = "target/release/waveshark", dest = "/usr/bin/waveshark", mode = "755" },
    { source = "crates/app/waveshark.desktop", dest = "/usr/share/applications/waveshark.desktop", mode = "644" },
    { source = "assets/logo/waveshark-icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/waveshark.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/waveshark/LICENSE", mode = "644" },
]
# ldd on the build machine would name Debian's sonames, so the dependencies
# are the Fedora package names instead.
auto-req = "no"

[package.metadata.generate-rpm.requires]
alsa-lib = "*"

[[example]]
name = "lime"
required-features = ["limesdr"]

[[example]]
name = "limediag"
required-features = ["limesdr"]

[[example]]
name = "limerate"
required-features = ["limesdr"]

[[example]]
name = "limesweep"
required-features = ["limesdr"]

[[example]]
name = "txcheck"
required-features = ["limesdr"]
