[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "waveshark"
path = "src/main.rs"

[dependencies]
eframe = "0.35"
egui = "0.35"

common.workspace = true
dsp.workspace = true
audio.workspace = true
rtlsdr.workspace = true
hackrf.workspace = true
limesdr = { workspace = true, optional = true }
iqnet.workspace = true
sources.workspace = true
nodes.workspace = true
gps.workspace = true
survey.workspace = true
decode.workspace = true
datasets.workspace = true
pipeline.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
libc = "0.2"
zstd = { version = "0.13", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
poll-promise = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
# LimeSuite is not packaged everywhere, and there is no vcpkg port of it, so
# the Windows build is made without this. Everything else here works with the
# driver absent: the device simply never appears in the list.
default = ["limesdr", "stt"]
limesdr = ["dep:limesdr"]
# TETRA decryption and key recovery. Off by default; a stock build links no
# TETRA cipher and no GPU stack, and its Keys view is an encryption monitor
# with nothing to decrypt with. Enable with `--features tea` (which turns on
# `nodes/tea` and `decode/tea`).
tea = ["nodes/tea", "decode/tea"]
# DMR speech decode through the AMBE vocoder (patent-encumbered, off by
# default). Turns on `nodes/ambe`.
ambe = ["nodes/ambe"]
# Transcribe decoded speech with a local Whisper model. On by default: a
# scanner that cannot tell you what was said is missing the point of a voice
# channel. The stage is switched off until a model directory exists, so a
# build with no model costs a node that copies packets. Turn it off with
# --no-default-features to keep candle and the tokenizer out of the build.
stt = ["nodes/stt"]

[[example]]
name = "lime"
required-features = ["limesdr"]

[[example]]
name = "limediag"
required-features = ["limesdr"]

[[example]]
name = "limerate"
required-features = ["limesdr"]

[[example]]
name = "limesweep"
required-features = ["limesdr"]

[[example]]
name = "txcheck"
required-features = ["limesdr"]
