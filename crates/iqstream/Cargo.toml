[package]
name = "iqstream"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["net"]
net = [
    "dep:tokio",
    "dep:zstd",
    "dep:futures-util",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:wtransport",
    "dep:str0m",
    "dep:str0m-proto",
    "dep:dimpl",
    "dep:rcgen",
    "dep:p256",
    "dep:aes",
    "dep:aes-gcm",
    "dep:ctr",
    "dep:hmac",
    "dep:sha1",
    "dep:sha2",
    "dep:time",
    "dep:getrandom",
    "dep:futures-channel",
    "dep:futures-core",
    "dep:ruzstd",
    "dep:httpc",
    "dep:wasm-bindgen-futures",
]

[dependencies]
common.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
wtransport = { version = "0.7", optional = true }
str0m = { version = "0.24", default-features = false, optional = true }
str0m-proto = { version = "0.7", default-features = false, features = ["dtls"], optional = true }
dimpl = { version = "0.7", default-features = false, features = ["rust-crypto"], optional = true }
rcgen = { version = "0.14", default-features = false, optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
ctr = { version = "0.9", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
httpc = { workspace = true, optional = true }
futures-channel = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
ruzstd = { version = "0.8", optional = true }

[dev-dependencies]
str0m = { version = "0.24", default-features = false }
ruzstd = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[[test]]
name = "nat"
required-features = ["net"]

[[test]]
name = "fallback"
required-features = ["net"]

[[test]]
name = "roundtrip"
required-features = ["net"]
