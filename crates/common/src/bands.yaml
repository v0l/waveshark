# The allocation table: what each stretch of spectrum is for.
#
# A band plan is knowledge about the world rather than about this program, so
# it is written down rather than compiled in: the receiver reads this file at
# startup and nothing else knows the numbers. `crates/common/src/bands.rs`
# parses it and the tests beside that parser pin what has to stay true.
#
# Every edge is in hertz, and integers on purpose: a megahertz written as a
# decimal does not survive the multiplication, and a band edge off by a
# nanohertz puts a frequency in the wrong band.
#
#   name       what the ribbon paints and a reading is called
#   hz         [lo, hi], half open: hi belongs to the next band
#   mode       how the band is listened to: wfm nfm am usb lsb cw
#   use        the service, which is how a decoder says where it can be:
#              broadcast aero amateur utility ism wlan cellular nav
#   step_hz    the legal channel spacing, where the band has one
#   origin_hz  a frequency the spacing lands on, where it is not a multiple
#              of the step itself
#
# Allocations nest. The narrowest band containing a frequency is the one that
# names it, so ISM 433 wins over the 70 cm band it sits inside.

# Below 30 MHz the ITU allocations are the same wherever the receiver is:
# the broadcasting bands numbered in metres, the aeronautical and maritime
# services, the standard frequency stations, and the amateur bands whose
# edges no region argues about. Sideband follows the convention a listener
# has to set rather than the regulation: lower below 10 MHz, upper above.
