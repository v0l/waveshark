[package]
name = "stt-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turns CUDA on in candle for crates/stt, where the target can build it"

[dependencies]
candle-core = { version = "0.11", features = ["cuda"] }
candle-nn = { version = "0.11", features = ["cuda"] }
candle-transformers = { version = "0.11", features = ["cuda"] }
