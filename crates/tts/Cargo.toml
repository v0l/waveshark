[package]
name = "tts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speech from text, locally, through candle"

[dependencies]
common.workspace = true
hfmodel.workspace = true
tracing.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde_json = "1"

[features]
# The GPU is on unless asked off, for the reason `stt` gives: this one is an
# autoregressive model generating audio tokens, and on a CPU it is slower
# than the speech it produces.
default = ["cuda"]
cuda = ["dep:stt-cuda"]

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
stt-cuda = { path = "../stt-cuda", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[dev-dependencies]
hound = "3"
anyhow.workspace = true
