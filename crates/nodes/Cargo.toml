[package]
name = "nodes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
chrono.workspace = true
tracing.workspace = true
audio.workspace = true
dsp.workspace = true
sources.workspace = true
identify.workspace = true
rustfft.workspace = true
pipeline.workspace = true
decode.workspace = true
gps.workspace = true
survey.workspace = true
# AMBE/IMBE vocoder for the DMR node. Off by default: the algorithm is
# patent-encumbered (see crates/mbe). Without it the DMR node still reads
# signalling and shows who is talking, but decodes no speech.
mbe = { workspace = true, optional = true }
poll-promise = { workspace = true, optional = true }
# Local speech to text. Off by default: candle and the tokenizers are a large
# dependency tree, and a receiver without a model directory has no use for it.
stt = { workspace = true, optional = true }
candle-core = { version = "0.11", optional = true }
crossbeam-channel.workspace = true
rayon.workspace = true
# M17 voice is Codec 2 3200, whose frame is exactly the 8 bytes M17 puts in
# half a stream frame. Pure Rust, so it costs the build nothing.
codec2 = "0.3.1"
# Reading a picture an operator picked, for the SSTV transmitter. PNG and
# JPEG only: what is wanted is a file a camera or a screenshot produced, and
# the rest of the crate's formats are decoders nothing here asks for.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Publishing what was heard to Home Assistant. No TLS features: a broker on
# the same house network is reached over plain MQTT, and pulling rustls in
# for it would cost every build that never speaks to one.
rumqttc = { version = "0.25", default-features = false, optional = true }
serde_json.workspace = true
iqstream.workspace = true
sdr-server = { workspace = true, optional = true }

[features]
# The app turns defaults off and names what it wants, so a default here is
# only what `cargo test -p nodes` builds. The native libraries stay off.
default = ["homeassistant", "iqstream", "feeds"]
homeassistant = ["dep:rumqttc"]
iqstream = ["iqstream/net", "dep:sdr-server"]
feeds = []
# TETRA air-interface decryption and TEA1 key recovery in the TETRA node.
# Off by default; enables `decode/tea`. Without it the node still reads
# signalling and decodes clear speech, but carries no cipher or key search.
tea = ["decode/tea", "dep:poll-promise"]
# DMR speech decode through the AMBE vocoder. Off by default (patent). Without
# it the DMR node reads signalling only.
ambe = ["dep:mbe"]
# Whisper transcription of decoded speech, on the packet bus.
stt = ["dep:stt", "dep:candle-core"]
# Pictures off a broadcast multiplex, through the system ffmpeg libraries.
ffmpeg = ["decode/ffmpeg"]

[dev-dependencies]
survey = { workspace = true, features = ["db"] }

[[example]]
name = "chain"

[[example]]
name = "bench"

[[example]]
name = "split"



# The pictures and the sound are what it prints, and both come out of the
# container reader.
[[example]]
name = "dvbt_video"
required-features = ["ffmpeg"]

[[example]]
name = "wifi_probe"

[[example]]
name = "wifi_cost"
