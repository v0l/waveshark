[package]
name = "nodes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
tracing.workspace = true
audio.workspace = true
dsp.workspace = true
rustfft.workspace = true
pipeline.workspace = true
decode.workspace = true
gps.workspace = true
survey.workspace = true
# AMBE/IMBE vocoder for the DMR node. Off by default: the algorithm is
# patent-encumbered (see crates/mbe). Without it the DMR node still reads
# signalling and shows who is talking, but decodes no speech.
mbe = { workspace = true, optional = true }
poll-promise = { workspace = true, optional = true }
# Local speech to text. Off by default: candle and the tokenizers are a large
# dependency tree, and a receiver without a model directory has no use for it.
stt = { workspace = true, optional = true, default-features = false }
candle-core = { version = "0.11", optional = true }
crossbeam-channel = { workspace = true, optional = true }
rayon.workspace = true
# M17 voice is Codec 2 3200, whose frame is exactly the 8 bytes M17 puts in
# half a stream frame. Pure Rust, so it costs the build nothing.
codec2 = "0.3.1"

[features]
# TETRA air-interface decryption and TEA1 key recovery in the TETRA node.
# Off by default; enables `decode/tea`. Without it the node still reads
# signalling and decodes clear speech, but carries no cipher or key search.
tea = ["decode/tea", "dep:poll-promise"]
# DMR speech decode through the AMBE vocoder. Off by default (patent). Without
# it the DMR node reads signalling only.
ambe = ["dep:mbe"]
# Whisper transcription of decoded speech, on the packet bus.
stt = ["dep:stt", "dep:candle-core", "dep:crossbeam-channel"]

[dev-dependencies]
sources.workspace = true

[[example]]
name = "chain"

[[example]]
name = "bench"

[[example]]
name = "split"



