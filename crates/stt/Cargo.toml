[package]
name = "stt"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
audio.workspace = true
tracing.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
byteorder = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
rustfft.workspace = true
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }

[features]
# The GPU is on unless asked off. A speech model on the CPU keeps up with one
# handheld and not with a repeater, and the receiver that runs it is more
# often on a machine with a card than not.
default = ["cuda"]
# On everything but a Mac. Cargo features cannot depend on the target, but a
# dependency can, so the feature turns on a crate that exists only where CUDA
# can be built and turns on nothing on a Mac, where the same build gets Metal
# below. Building needs the CUDA toolkit on the path: `nvcc` compiles
# candle's kernels. A machine without one builds with
# `--no-default-features`.
cuda = ["dep:stt-cuda"]

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
stt-cuda = { path = "../stt-cuda", optional = true }

# Metal is not a choice on a Mac, it is what the GPU is called, and the crates
# behind it refuse to compile anywhere else. As a feature it broke
# `--all-features` on Linux, since that turns on every feature a package
# declares whether or not the platform can build it.
[target.'cfg(target_vendor = "apple")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[dev-dependencies]
hound = "3"
candle-core = "0.11"

[[example]]
name = "transcribe"
