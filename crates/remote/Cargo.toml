[package]
name = "remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["iqstream", "rtl_tcp", "spyserver", "kiwisdr", "pluto"]
iqstream = ["iqstream/net", "dep:tokio", "dep:httpc", "dep:nostr-directory"]
rtl_tcp = []
spyserver = []
kiwisdr = ["dep:httpc", "dep:tungstenite"]
pluto = ["dep:quick-xml"]
usb = ["pluto", "dep:nusb"]

[dependencies]
common.workspace = true
dsp.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
nusb = { workspace = true, optional = true }
quick-xml = { version = "0.41", optional = true }
iqstream.workspace = true
httpc = { workspace = true, optional = true }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync"], optional = true }
nostr-directory = { workspace = true, features = ["relay"], optional = true }

[dev-dependencies]
sdr-directory.workspace = true

[[test]]
name = "serve"
required-features = ["iqstream", "rtl_tcp", "spyserver"]
