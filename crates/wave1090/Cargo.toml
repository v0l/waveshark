[package]
name = "wave1090"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A 1090 MHz Mode S receiver that speaks dump1090's network protocols"

[dependencies]
common.workspace = true
dsp.workspace = true
decode.workspace = true
sources.workspace = true
rtlsdr.workspace = true
remote = { workspace = true, features = ["iqstream"] }
iqstream = { workspace = true, features = ["net"] }
sdr-directory.workspace = true
nostr-directory = { workspace = true, features = ["relay"] }
tokio = { version = "1", features = ["rt", "signal"] }
clap.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "wave1090"
path = "src/main.rs"
