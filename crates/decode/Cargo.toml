[package]
name = "decode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common.workspace = true
dsp.workspace = true
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
poll-promise = { workspace = true, optional = true }

[features]
# TETRA air-interface decryption and TEA1 key recovery: the recovered
# proprietary ciphers, the register search, and the GPU backend. Off by
# default, so a stock build carries none of it and links no GPU stack; the
# source stays in the tree for anyone who builds with `--features tea`.
tea = ["dep:wgpu", "dep:bytemuck", "dep:poll-promise"]

[dev-dependencies]
sources.workspace = true
