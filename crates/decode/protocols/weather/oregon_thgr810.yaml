# Oregon Scientific v3 THGR810 thermo-hygrometer, 433.92 MHz: Manchester at
# 1024 baud behind a 0005 sync in either polarity, every nibble sent with its
# bits reversed and every reading in BCD. The checksum is the sum of the
# nibbles before it, stored with its own two nibbles swapped. The same
# family's THN802 and WGR800 are files beside this one.
name: Oregon-THGR810
timing: { manchester: [488, 976], reset_us: 2400 }
frame: { bits: 68, find: sync, sync: "0005", sync_bits: 16, either_polarity: true }
transform: [reflect_nibbles]
check: { kind: nibble_sum, over: [0, 60], at: 60, swap: true }
fields:
  - { bits: 16, hidden: true, in: [0xf824, 0xf024, 0xf224, 0xfa24, 0xf8b4], default: 0xf824, name: sensor }
  - { name: channel, bits: 4, data: int }
  - { bits: 4, hidden: true }
  - { bits: 4, hidden: true }
  - { bits: 1, hidden: true }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { bits: 2, hidden: true }
  - { name: id, gather: [[24, 28], [20, 24]], data: int }
  - { bits: 12, hidden: true }
  - { bits: 1, hidden: true }
  - { bits: 3, hidden: true }
  - { bits: 8, hidden: true }
  - { name: temperature_c, gather: [[45, 48], [40, 44], [36, 40], [32, 36]], type: bcd, sign: 44, data: float, unit: c, scale: 0.1, min: -50, max: 70 }
  - { name: humidity_pct, gather: [[52, 56], [48, 52]], type: bcd, data: int, unit: pct, max: 100 }
  - { bits: 4, hidden: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "f8 24 1a 30 71 20 84 01 40"
    fields: { channel: 1, battery_ok: true, id: 0x3a, temperature_c: 21.7, humidity_pct: 48 }
  - hex: "f8 24 1a 34 58 08 84 00 50"
    fields: { channel: 1, battery_ok: false, id: 0x3a, temperature_c: -8.5, humidity_pct: 48 }
