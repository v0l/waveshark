# LaCrosse TX141TH-Bv2, also sold as TFA 30.3221.02 and 30.3249.02. Four
# 833 us sync marks then 40 PWM bits, inverted, twelve times per burst. The
# check is an LFSR digest, not a CRC, over the first four bytes.
name: LaCrosse-TX141THBv2
timing: { pwm: [208, 417], sync_us: 833, reset_us: 1700 }
frame: { bits: 40, invert: true, repeats: 12 }
check: { kind: lfsr8_reflect, gen: 0x31, key: 0xf4, over: [0, 32], at: 32 }
fields:
  - { name: id, bits: 8, min: 1 }
  - { name: battery_ok, bits: 1, type: bool, not: true }
  - { name: test, bits: 1, type: bool, omit_if: 0 }
  - { name: channel, bits: 2 }
  - { name: temperature_c, bits: 12, scale: 0.1, offset: -50, min: -40, max: 60 }
  - { name: humidity_pct, bits: 8, min: 1, max: 100 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "9c 12 e0 2c e7"
    fields: { id: 0x9c, battery_ok: true, channel: 1, temperature_c: 23.6, humidity_pct: 44 }
