# Acurite 592TXR tower sensor, 433.92 MHz: PWM behind a sync mark, inverted,
# message type 4, with an additive checksum and even parity over the bytes
# between the id and the sum. The temperature is fourteen bits spread over
# two bytes under their parity bits.
name: Acurite-Tower
timing: { pwm: [220, 408], sync_us: 620, reset_us: 4000 }
frame: { bits: 56, invert: true, repeats: 3 }
check:
  - { kind: sum8, over: [0, 48], at: 48 }
  - { kind: even_parity, over: [16, 48] }
fields:
  - { name: channel, bits: 2, in: [0, 2, 3], map: { 0: C, 2: B, 3: A } }
  - { name: id, bits: 14 }
  - { bits: 1, hidden: true }
  - { name: battery_ok, bits: 1, type: bool }
  - { bits: 6, const: 4 }
  - { bits: 1, hidden: true }
  # 127 is a sensor without a humidity element
  - { name: humidity_pct, bits: 7, max: 100, omit_if: 127 }
  - { name: temperature_c, bits: 16, per_byte: 7, scale: 0.1, offset: -100, min: -40, max: 70 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "d2 34 44 b7 09 a0 aa"
    fields: { channel: A, id: 0x1234, battery_ok: true, humidity_pct: 55, temperature_c: 18.4 }
