# Acurite 986 fridge and freezer probes, 433.92 MHz, PPM, five bytes sent
# least significant bit first with a reflected CRC-8. A row of the burst
# has to be about the frame's length, which is most of the integrity check.
# The temperature is a sign bit and a magnitude in whole Fahrenheit; the
# display calls probe one the fridge (1R) and probe two the freezer (2F).
name: Acurite-986
timing: { ppm: [520, 880], reset_us: 4000 }
frame: { bits: 40, find: rows, copies: 1, row_bits: [39, 43], not_constant: 24, repeats: 2 }
transform: [reflect_bytes]
check: { kind: crc8_le, poly: 0x07, init: 0, over: [0, 32], at: 32 }
fields:
  - { name: temperature_c, bits: 8, type: sign_mag, convert: f_to_c, round: 1, min: -40, max: 32.3 }
  - { name: id, bits: 16 }
  - { name: status, bits: 7 }
  - { name: channel, bits: 1, map: { 0: 1R, 1: 2F } }
  - { name: battery_ok, at: 30, bits: 1, type: bool, not: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "85 10 ac 02 e3"
    fields: { temperature_c: -20.6, id: 0x10ac, status: 1, channel: 1R, battery_ok: false }
