# Ambient Weather F007TH, also the F012TH and TF 30.3208.02: Manchester at
# 500 us a half symbol, six bytes behind a preamble whose last nibble opens
# the first byte, in either polarity, with an LFSR digest for a
# check. Temperature is Fahrenheit tenths offset 400, reported in Celsius.
name: Ambientweather-F007TH
timing: { manchester: [500, 1000], reset_us: 2400 }
frame: { bits: 48, find: sync, sync: "0140", sync_bits: 12, sync_skip: 8, either_polarity: true }
check: { kind: lfsr8, gen: 0x98, key: 0x3e, xor: 0x64, over: [0, 40], at: 40 }
fields:
  - { bits: 4, const: 4 }
  - { bits: 4, hidden: true }
  - { name: id, bits: 8, data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: channel, bits: 3, data: int, offset: 1 }
  - { name: temperature_c, bits: 12, data: float, unit: c, scale: 0.1, offset: -40, convert: f_to_c, round: 1, min: -40, max: 60 }
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "40 2a 04 21 2b 11"
    fields: { id: 0x2a, battery_ok: true, channel: 1, temperature_c: 18.7, humidity_pct: 43 }
