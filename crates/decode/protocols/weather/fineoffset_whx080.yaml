# Fine Offset WH1080/WH3080 weather station, the OOK variant, also sold as
# Watson W-8681, Digitech XC0348, PCE-FWS 20, Elecsa AstroTouch 6975 and
# Froggit WH1080. Every 48 seconds on 433.92, 868.3 or 915 MHz by region.
# Eleven bytes of PWM opening on a byte of ones, with a CRC-8 over all of
# them. Message 0xa is the weather and 0xb the station's DCF77 clock.
name: Fineoffset-WHx080
timing: { pwm: [544, 1524], reset_us: 2800 }
frame: { bits: 88, find: sync, sync: "ff", sync_bits: 8, sync_skip: 0 }
check: { kind: crc8, poly: 0x31, init: 0xff, over: [0, 80], at: 80 }
fields:
  - { bits: 8, const: 0xff }
  - { name: format, bits: 4, hidden: true, in: [0xa, 0xb] }
  - { name: msg_type, at: 8, bits: 4, data: int, map: { 0xa: 0, 0xb: 1 } }
  - { name: station_id, bits: 8, data: int, id: true }
  - when: { format: 0xa }
    fields:
      - { bits: 2, hidden: true }
      - { name: temperature_c, bits: 10, data: float, unit: c, scale: 0.1, offset: -40, min: -50, max: 80 }
      - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100 }
      - { name: wind_avg_ms, bits: 8, data: float, unit: m_s, scale: 0.34, round: 2 }
      - { name: wind_gust_ms, bits: 8, data: float, unit: m_s, scale: 0.34, round: 2 }
      - { bits: 4, hidden: true }
      - { name: rain_total_mm, bits: 12, data: float, unit: mm, scale: 0.3, round: 2 }
      - { name: battery_ok, bits: 4, data: bool, map: { 1: false }, other: true }
      - name: wind_direction_deg
        bits: 4
        data: int
        unit: deg
        map: { 0: 0, 1: 23, 2: 45, 3: 68, 4: 90, 5: 113, 6: 135, 7: 158, 8: 180, 9: 203, 10: 225, 11: 248, 12: 270, 13: 293, 14: 315, 15: 338 }
    else:
      - { bits: 4, hidden: true }
      - { bits: 2, hidden: true }
      - { name: hours, bits: 6, type: bcd, hidden: true, max: 23 }
      - { name: minutes, bits: 8, type: bcd, hidden: true, max: 59 }
      - { name: seconds, bits: 8, type: bcd, hidden: true, max: 59 }
      - { name: time, data: text, type: format, format: "{hours:02}:{minutes:02}:{seconds:02}" }
      - { bits: 32, hidden: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "ff ac 42 32 59 00 00 01 19 08 17"
    fields: { msg_type: 0, station_id: 196, temperature_c: 16.2, humidity_pct: 89, wind_avg_ms: 0.0, wind_gust_ms: 0.0, rain_total_mm: 84.3, battery_ok: true, wind_direction_deg: 180 }
  - hex: "ff ac 42 32 59 0a 14 01 19 18 cb"
    fields: { msg_type: 0, station_id: 196, temperature_c: 16.2, humidity_pct: 89, wind_avg_ms: 3.4, wind_gust_ms: 6.8, rain_total_mm: 84.3, battery_ok: false, wind_direction_deg: 180 }
  - hex: "ff bc 40 12 34 56 00 00 00 00 da"
    fields: { msg_type: 1, station_id: 196, time: "12:34:56" }
