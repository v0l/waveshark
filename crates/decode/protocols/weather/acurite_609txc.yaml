# Acurite 609TXC, 433.92 MHz, PPM, five bytes behind an additive checksum.
#
# A byte-wide sum over four bytes is weak enough that a burst of something
# else passes it every few hundred windows, so the sanity rules carry as
# much weight as the checksum. A zero id is one: the sensor draws it at
# random when the batteries go in and never reports zero. Seen on rtl_433's
# own X10 recording, which once read as a sensor at 14.3 C and 0%.
name: Acurite-609TXC
timing: { ppm: [1000, 2000], reset_us: 10000 }
frame: { bits: 40, repeats: 3 }
check: { kind: sum8, over: [0, 32], at: 32 }
fields:
  - { name: id, bits: 8, min: 1 }
  - { name: battery_ok, bits: 1, type: bool, not: true }
  - { bits: 3, const: 2 }
  - { name: temperature_c, bits: 12, type: int, scale: 0.1, min: -40, max: 70 }
  - { name: humidity_pct, bits: 8, max: 100 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "8f 21 2d 38 15"
    fields: { id: 0x8f, battery_ok: true, temperature_c: 30.1, humidity_pct: 56 }
