# Oregon Scientific v3 THN802 thermometer: the THGR810's frame without the
# humidity, the checksum twelve nibbles in and stored with its nibbles
# swapped.
name: Oregon-THN802
timing: { manchester: [488, 976], reset_us: 2400 }
frame: { bits: 56, find: sync, sync: "0005", sync_bits: 16, either_polarity: true }
transform: [reflect_nibbles]
check: { kind: nibble_sum, over: [0, 48], at: 48, swap: true }
fields:
  - { bits: 16, const: 0xc844 }
  - { name: channel, bits: 4, data: int }
  - { bits: 4, hidden: true }
  - { bits: 4, hidden: true }
  - { bits: 1, hidden: true }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { bits: 2, hidden: true }
  - { name: id, gather: [[24, 28], [20, 24]], data: int }
  - { bits: 12, hidden: true }
  - { bits: 1, hidden: true }
  - { bits: 3, hidden: true }
  - { name: temperature_c, gather: [[45, 48], [40, 44], [36, 40], [32, 36]], type: bcd, sign: 44, data: float, unit: c, scale: 0.1, min: -50, max: 70 }
  - { bits: 8, hidden: true }
vectors:
  - hex: "c8 44 2b 50 49 10 c3"
    fields: { channel: 2, battery_ok: true, id: 0x5b, temperature_c: 19.4 }
