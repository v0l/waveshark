# Emos TTX201 thermometer, and the IROX ETS69 that sends the same frame,
# 433.92 MHz: Manchester at 510 us, 50-bit packets sent eight times with a
# six bit sum of the nibbles after the id, and a separator nibble between
# copies that the last copy leaves off and this does not read. The ETS69
# sends its DCF77 clock once an hour in the same frame, which is not read.
name: Emos-TTX201
timing: { manchester: [510, 1020], reset_us: 1700, tolerance_us: 250 }
frame: { bits: 50, find: sync, sync: "00", sync_bits: 4, sync_skip: 0, row_bits: [50, 60], repeats: 8 }
check: { kind: nibble_sum, over: [10, 50], at: 4, width: 6 }
fields:
  - { bits: 4, const: 0 }
  # a sum of zero is silence, not a reading
  - { name: chk, bits: 6, hidden: true, min: 1 }
  - { name: id, bits: 8, data: int }
  - { bits: 1, hidden: true }
  - { bits: 3, hidden: true, in: [0], name: kind, default: 0 }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: channel, bits: 3, data: int, offset: 1 }
  - { bits: 1, hidden: true }
  - { bits: 3, hidden: true }
  - { name: temperature_c, bits: 12, type: int, data: float, unit: c, scale: 0.1, min: -40, max: 70 }
  - { bits: 8, hidden: true, in: [0x14, 0], default: 0x14 }
vectors:
  - { hex: "07 30 80 00 42 05 00", fields: { id: 194, battery_ok: true, channel: 1, temperature_c: 26.4 } }
