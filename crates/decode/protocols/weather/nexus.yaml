# Nexus and the many rebadges of it: FreeTec NC-7345, infactory NX-3980,
# Solight TE82S, TFA 30.3209.02. 36 bits, PPM, 433.92 MHz, twelve copies.
#
# No checksum, only a constant nibble, so the report carries no integrity
# check and the sanity limits are all that keep a burst of something else
# from reading as a sensor. Layout from rtl_433's nexus.c.
name: Nexus-TH
timing: { ppm: [1000, 2000], reset_us: 5000 }
frame: { bits: 36, repeats: 12 }
# The Rubicson/Solight-TE44/EMOS family has an all but identical layout whose
# last byte is a real CRC rather than humidity; a frame that passes it is theirs.
yields_to: [Rubicson-Temperature]
fields:
  - { name: id, bits: 8, data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool }
  - { name: test, bits: 1, data: bool, type: bool, omit_if: 0 }
  - { name: channel, bits: 2, data: int, offset: 1, max: 3 }
  - { name: temperature_c, bits: 12, data: float, unit: c, type: int, scale: 0.1, min: -40, max: 70 }
  - { bits: 4, const: 0xf }
  # zero means the sensor has no humidity element, not zero percent
  - { name: humidity_pct, bits: 8, data: int, unit: pct, max: 100, omit_if: 0 }
vectors:
  - hex: "5c 90 c2 f3 e0"
    fields: { id: 0x5c, channel: 2, temperature_c: 19.4, humidity_pct: 62, battery_ok: true }
  - hex: "5c 2f a9 f3 70"
    fields: { id: 0x5c, channel: 3, temperature_c: -8.7, humidity_pct: 55, battery_ok: false }
  - hex: "5c 80 c2 f0 00"
    fields: { id: 0x5c, channel: 1, temperature_c: 19.4, battery_ok: true }
  - hex: "5c c0 c2 f3 e0"
    fields: { id: 0x5c, channel: 1, temperature_c: 19.4, humidity_pct: 62, battery_ok: true, test: true }
