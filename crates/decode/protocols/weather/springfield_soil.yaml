# Springfield PreciseTemp soil moisture and temperature probe, 433.92 MHz:
# PPM at the Alecto and Prologue timings, 36 bits with a nibble XOR for a
# check, on three rows of a burst. A frame satisfying Alecto's checksum is
# Alecto's.
name: Springfield-Soil
timing: { ppm: [2000, 4000], reset_us: 9200 }
frame: { bits: 36, find: rows, copies: 2, row_bits: [36, 37], not_constant: 32, repeats: 3 }
yields_to: [AlectoV1-Temperature, AlectoV1-Rain]
check: { kind: nibble_xor, over: [0, 28], at: 28 }
fields:
  - { name: id, bits: 8, data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: button, bits: 1, data: int }
  - { name: transmit, at: 9, bits: 1, data: text, map: { 1: MANUAL, 0: AUTO } }
  - { name: channel, bits: 2, data: int, offset: 1 }
  - { name: temperature_c, bits: 12, type: int, data: float, unit: c, scale: 0.1, min: -30, max: 70 }
  - { name: moisture_pct, bits: 4, data: int, unit: pct, scale: 10, max: 100 }
  - { bits: 4, hidden: true }
  - { bits: 4, hidden: true }
vectors:
  - { hex: "d4 80 ce 03 00", fields: { id: 212, battery_ok: false, button: 0, transmit: AUTO, channel: 1, temperature_c: 20.6, moisture_pct: 0 } }
