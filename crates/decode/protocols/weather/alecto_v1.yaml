# Alecto V1 weather sensors: the WS3500 and WS4500, Ventus W155 and W044,
# Auriol and Silvercrest rebadges. 433.92 MHz, PPM at 2 and 4 ms, the same
# 36 bits and timings as Prologue and told apart by the checksum in the last
# nibble: the nibbles of the first four bytes summed as they read bit
# reversed, biased by whether the frame is a rain message, and stored bit
# reversed. Every byte arrives least significant bit first, so the fields
# are reflected where they are read. Message type 3 is the rain gauge, and
# a wind message under it is refused: wind takes its speed from one row of
# a burst and its gust from another five rows later.
name: AlectoV1-Temperature
timing: { ppm: [2000, 4000], reset_us: 10000 }
frame: { bits: 36, find: rows, copies: 2, repeats: 7 }
check:
  - { kind: nibble_sum, reflect: true, over: [0, 32], at: 32, width: 4, add: 7, when: { bias: 108 } }
  - { kind: nibble_sum, reflect: true, over: [0, 32], at: 32, width: 4, negate: true, init: 15, unless: { bias: 108 } }
fields:
  - { name: id, bits: 8, data: int, reflect: true }
  - { name: channel, gather: [4, 5], data: int }
  - { name: battery_ok, bits: 1, data: bool, type: bool, not: true }
  - { name: message, gather: [9, 10], hidden: true }
  - { name: bias, at: 9, bits: 7, hidden: true }
  - { bits: 2, hidden: true, default: 0 }
  - { bits: 1, hidden: true, default: 0 }
  - { bits: 4, hidden: true }
  - { bits: 8, hidden: true }
  - { bits: 8, hidden: true }
  - { bits: 4, hidden: true }
  - when: { message: 3 }
    model: AlectoV1-Rain
    fields:
      - { at: 12, bits: 4, const: 0xc }
      - { name: rain_total_mm, gather: [[16, 32]], reflect: true, data: float, unit: mm, scale: 0.25, round: 2 }
    else:
      - { name: temperature_c, gather: [[12, 24]], reflect: true, type: int, data: float, unit: c, scale: 0.1 }
      - { name: humidity_pct, at: 24, bits: 8, reflect: true, type: bcd, data: int, unit: pct, max: 100 }
vectors:
  - hex: "34 00 48 6c a0"
    fields: { id: 44, channel: 1, battery_ok: true, temperature_c: 28.8, humidity_pct: 36 }
  - hex: "ef 0b 3f 46 90"
    fields: { id: 247, channel: 3, battery_ok: true, temperature_c: -5.1, humidity_pct: 62 }
