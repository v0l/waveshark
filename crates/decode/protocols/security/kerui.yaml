# Kerui PIR, door contact, water leak and panic button sensors (D026, WD51,
# P831), 433.92 MHz: an EV1527 style 24-bit fixed code, PWM, a short mark
# being a 0, with the sync gap running into the next copy as a 25th bit. A
# 20-bit id and a 4-bit command naming the event. No checksum.
name: Kerui-Security
timing: { pwm: [420, 960], reset_us: 9900, tolerance_us: 160 }
frame: { bits: 25, find: rows, copies: 3, not_constant: 24, repeats: 25 }
fields:
  - { name: id, bits: 20, data: int, not: true, min: 1 }
  - { name: cmd, bits: 4, data: int, not: true, in: [0xa, 0xe, 0x7, 0xb, 0x5, 0xf] }
  - { bits: 1, hidden: true }
  - { name: state, at: 20, bits: 4, not: true, data: text, map: { 0xa: motion, 0xe: open, 0x7: close, 0xb: tamper, 0x5: water, 0xf: battery } }
  - { name: motion, at: 20, bits: 4, not: true, data: int, map: { 0xa: 1 }, when: { cmd: 10 } }
  - { name: opened, at: 20, bits: 4, not: true, data: int, map: { 0xe: 1, 0x7: 0 }, when: { cmd: [14, 7] } }
  - { name: tamper, at: 20, bits: 4, not: true, data: int, map: { 0xb: 1 }, when: { cmd: 11 } }
  - { name: water, at: 20, bits: 4, not: true, data: int, map: { 0x5: 1 }, when: { cmd: 5 } }
  - { name: battery_ok, at: 20, bits: 4, not: true, data: bool, map: { 0xf: false }, when: { cmd: 15 } }
vectors:
  - { hex: "9b 24 d1 00", fields: { id: 413106, cmd: 14, state: open, opened: 1 } }
