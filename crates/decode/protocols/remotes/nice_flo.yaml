# Nice FLO: an Italian gate remote's 12-bit fixed code. The FLO2 and FLOR
# rolling codes are other protocols. A short mark is a 0 and a long mark a
# 1, so the frame is inverted. No checksum.
name: Nice-Flo
timing: { pwm: [700, 1400], reset_us: 3000 }
frame: { bits: 12, invert: true, find: tile, min_transitions: 3, repeats: 3 }
fields:
  - { name: code, bits: 12 }
vectors:
  - { hex: "ab c0", fields: { code: 0xabc } }
