# CAME, the gate maker's fixed-code fobs, in the 12-bit form. AirForce and
# PRASTEL share the timing and the Flipper tells them apart by length; only
# the two CAME lengths are described, the 24-bit one in came24.yaml, so a
# 24-bit frame is not also read as two 12-bit halves.
#
# A short mark is a 0 and a long mark a 1, so the frame is inverted. No
# checksum: the frame length and its repeats are the only evidence.
name: CAME-12bit
timing: { pwm: [320, 640], reset_us: 2500 }
frame: { bits: 12, invert: true, find: tile, min_transitions: 3, repeats: 3 }
fields:
  - { name: code, bits: 12 }
vectors:
  - { hex: "ab c0", fields: { code: 0xabc } }
