# BETT and the Italian gate makers on its chipset: an 18-bit fixed address
# set in the fob, from which the receiver's DIP pattern is derived. A short
# mark of 340 us is a 0 and a long one of 2 ms a 1, so the frame is
# inverted. No checksum, no serial and no button split. The guard gap
# between frames splits each into its own package.
name: Bett
timing: { pwm: [340, 2000], reset_us: 15000 }
frame: { bits: 18, invert: true, find: tile, min_transitions: 3, repeats: 3 }
fields:
  - { name: code, bits: 18 }
vectors:
  - { hex: "ea f3 40", fields: { code: 0x3abcd } }
