# Holtek HT12D/HT12E: 12-bit fixed-code remotes, the smallest fob format the
# Flipper supports. A short mark is a 0 and a long mark a 1, so the frame is
# inverted. An 8-bit address and a 4-bit button, no checksum.
name: Holtek-HT12x
timing: { pwm: [320, 640], reset_us: 2500 }
frame: { bits: 12, invert: true, find: tile, min_transitions: 3, repeats: 3 }
fields:
  - { name: code, bits: 12 }
  - { name: serial, at: 0, bits: 8 }
  - { name: btn, at: 8, bits: 4 }
vectors:
  - { hex: "ab c0", fields: { code: 0xabc, serial: 0xab, btn: 0xc } }
