# Renault tyre pressure sensors, 433 MHz: FSK at 52 us a chip, Manchester
# behind an aaa9 preamble, nine bytes with a CRC-8. The id is sent low
# byte first; pressure in 0.75 kPa steps shares its top bits with the
# flags; temperature offset 30 C.
name: Renault
timing: { nrz: 52, reset_us: 150 }
frame: { bits: 72, find: sync, sync: "aaa9", sync_bits: 16, decode: manchester, either_polarity: true }
check: { kind: crc8, poly: 0x07, init: 0x00, over: [0, 64], at: 64 }
fields:
  - { name: flags, bits: 6, data: text, type: hex }
  - { name: pressure_kpa, bits: 10, data: float, unit: kpa, scale: 0.75 }
  - { name: temperature_c, bits: 8, data: float, unit: c, offset: -30, round: 0, min: -40, max: 100 }
  - { bits: 24, hidden: true }
  - { name: id, gather: [[40, 48], [32, 40], [24, 32]], data: text, type: hex }
  - { bits: 16, hidden: true }
  - { bits: 8, hidden: true }
vectors:
  - hex: "d1 0e 37 93 f2 87 00 00 2a"
    fields: { flags: "34", pressure_kpa: 202.5, temperature_c: 25.0, id: "87f293" }
