# Recorded IQ captures used by tests.
#
# These live on nostr.download rather than in git: IQ is close to incompressible
# (this one only shrinks 20% under xz -9) and committing captures would bloat
# history permanently for data that never changes.
#
# Fetch them with:  ./testdata/fetch.sh
# Tests that need a fixture skip cleanly when it is absent, so a fresh clone
# still builds and passes without network access.

[[capture]]
name = "fineoffset_wh1080_433.92M_250k.cu8"
sha256 = "5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19"
url = "https://nostr.download/5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19.xz"
compression = "xz"
center_hz = 433_920_000
rate_sps = 250_000
format = "cu8"
description = """
Fine Offset WH1080 weather station, OOK PWM at 433.92 MHz. Captured on an
RTL-SDR with an R820T tuner at 49.6 dB gain. Contains one complete
transmission. Independently decoded by rtl_433 25.02, which is what makes it
useful: the expected values below come from a different implementation, so a
decoder agreeing with them is real evidence rather than a restatement of our
own assumptions.
"""

[capture.expect]
model = "Fineoffset-WHx080"
station_id = 196
temperature_c = 16.2
humidity_pct = 89
wind_direction_deg = 180
wind_avg_ms = 0.0
wind_gust_ms = 0.0
rain_total_mm = 84.3
battery_ok = true
crc_valid = true

[[capture]]
name = "wfm_stereo_95.5M_1024k.cu8"
sha256 = "659e95cd8458fba622e40cb31b118318ce5eac7e7d1ada0e39fcd9c11c46e837"
url = "https://nostr.download/659e95cd8458fba622e40cb31b118318ce5eac7e7d1ada0e39fcd9c11c46e837.xz"
compression = "xz"
center_hz = 95_500_000
rate_sps = 1_024_000
format = "cu8"
description = """
Broadcast stereo FM at 95.8 MHz, captured with the receiver tuned 300 kHz low
so the station avoids the RTL2832U's DC spur. RTL-SDR with an R820T tuner at
49.6 dB gain, telescopic antenna.

The value of this capture is the 19 kHz stereo pilot. Every stereo FM broadcast
carries a tone at exactly 19000 Hz, so its presence and its exact frequency
verify the whole receive chain at once: tuning, mixing, decimation, the
discriminator, and all the sample-rate bookkeeping behind them. A demodulator
that merely sounds plausible can still be wrong; one that puts the pilot at
19000.0 Hz is not.
"""

[capture.expect]
station_offset_hz = 300_000
pilot_hz = 19_000
pilot_snr_db_min = 30.0

[[capture]]
name = "rds_92.4M_1024k.cu8"
sha256 = "97e34827e2f219d671393c0604de0bf1a04cf7248e6419f8c415ceb84105b306"
url = "https://nostr.download/97e34827e2f219d671393c0604de0bf1a04cf7248e6419f8c415ceb84105b306.xz"
compression = "xz"
center_hz = 92_400_000
rate_sps = 1_024_000
format = "cu8"
description = """
Twenty seconds of Spirit Radio on 92.4 MHz, carrying RDS. RTL-SDR with an R820T
tuner at 40.2 dB gain, telescopic antenna.

This exists because the earlier FM fixture does not. Development against
95.8 MHz spent a long time on a decoder that appeared broken, when measuring
the band around 57 kHz showed it sat at the noise floor: that station radiates
a pilot but no subcarriers, so there was nothing there to decode. A capture
with RDS actually present is the difference between testing a decoder and
testing an antenna.

The station name and the identifier are the useful assertions. An identifier is
constant for a station, so one that changes between runs is the signature of a
decoder reading noise through valid-looking syndromes rather than decoding.
"""

[capture.expect]
pi = 0x2208
station_name = "SPIRIT"
radiotext_contains = "Spirit"
group_yield_min_pct = 60.0

[[capture]]
name = "adsb_1090M_2400k.cu8"
sha256 = "fc3821a72532469b2ef001daf324b2492786467a164144f7aa5491e4b65fdb58"
url = "https://nostr.download/fc3821a72532469b2ef001daf324b2492786467a164144f7aa5491e4b65fdb58.xz"
compression = "xz"
center_hz = 1_090_000_000
rate_sps = 2_400_000
format = "cu8"
description = """
Four seconds of 1090 MHz, RTL-SDR at 49.6 dB gain on a telescopic antenna
indoors, so the aircraft are the loud ones and the rest of the band is noise.
That is the useful property: a Mode S demodulator that only works on strong
signals looks fine on a clean capture, and this one has marginal frames in it.

The reference decode in adsb_1090M_2400k.dump1090.hex comes from dump1090-rb
1.0.15 run over this exact file, so agreement is evidence from an independent
implementation rather than a restatement of our own assumptions. It finds 40
distinct frames; the tests require most of those and, more importantly, no
frame that dump1090 did not also see.
"""

[capture.expect]
reference = "adsb_1090M_2400k.dump1090.hex"
reference_frames = 40
matched_min = 25
false_positives = 0
icao = 0x4b1880
