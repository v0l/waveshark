# Recorded IQ captures used by tests.
#
# These live on nostr.download rather than in git: IQ is close to incompressible
# (this one only shrinks 20% under xz -9) and committing captures would bloat
# history permanently for data that never changes.
#
# Fetch them with:  ./testdata/fetch.sh
# Tests that need a fixture skip cleanly when it is absent, so a fresh clone
# still builds and passes without network access.

[[capture]]
name = "fineoffset_wh1080_433.92M_250k.cu8"
sha256 = "5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19"
url = "https://nostr.download/5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19.xz"
compression = "xz"
center_hz = 433_920_000
rate_sps = 250_000
format = "cu8"
description = """
Fine Offset WH1080 weather station, OOK PWM at 433.92 MHz. Captured on an
RTL-SDR with an R820T tuner at 49.6 dB gain. Contains one complete
transmission. Independently decoded by rtl_433 25.02, which is what makes it
useful: the expected values below come from a different implementation, so a
decoder agreeing with them is real evidence rather than a restatement of our
own assumptions.
"""

[capture.expect]
model = "Fineoffset-WHx080"
station_id = 196
temperature_c = 16.2
humidity_pct = 89
wind_direction_deg = 180
wind_avg_ms = 0.0
wind_gust_ms = 0.0
rain_total_mm = 84.3
battery_ok = true
crc_valid = true

[[capture]]
name = "wfm_stereo_95.5M_1024k.cu8"
sha256 = "659e95cd8458fba622e40cb31b118318ce5eac7e7d1ada0e39fcd9c11c46e837"
url = "https://nostr.download/659e95cd8458fba622e40cb31b118318ce5eac7e7d1ada0e39fcd9c11c46e837.xz"
compression = "xz"
center_hz = 95_500_000
rate_sps = 1_024_000
format = "cu8"
description = """
Broadcast stereo FM at 95.8 MHz, captured with the receiver tuned 300 kHz low
so the station avoids the RTL2832U's DC spur. RTL-SDR with an R820T tuner at
49.6 dB gain, telescopic antenna.

The value of this capture is the 19 kHz stereo pilot. Every stereo FM broadcast
carries a tone at exactly 19000 Hz, so its presence and its exact frequency
verify the whole receive chain at once: tuning, mixing, decimation, the
discriminator, and all the sample-rate bookkeeping behind them. A demodulator
that merely sounds plausible can still be wrong; one that puts the pilot at
19000.0 Hz is not.
"""

[capture.expect]
station_offset_hz = 300_000
pilot_hz = 19_000
pilot_snr_db_min = 30.0

[[capture]]
name = "rds_92.4M_1024k.cu8"
sha256 = "8ce11d7d31bfa4208de002090f34a1f5a99447744eedfbe1922c8c35ff65a7d3"
url = "https://nostr.download/8ce11d7d31bfa4208de002090f34a1f5a99447744eedfbe1922c8c35ff65a7d3.xz"
compression = "xz"
center_hz = 92_400_000
rate_sps = 1_024_000
format = "cu8"
description = """
Eighteen seconds of Spirit Radio on 92.4 MHz, carrying RDS. RTL-SDR with an
R820T tuner at 40.2 dB gain, telescopic antenna. The first eighteen seconds of
a forty second recording, which is what a radiotext cycle needs: at twelve
seconds the text has not come round in full and the assertion below fails, so
the length is a measurement and not a preference.

This exists because the earlier FM fixture does not. Development against
95.8 MHz spent a long time on a decoder that appeared broken, when measuring
the band around 57 kHz showed it sat at the noise floor: that station radiates
a pilot but no subcarriers, so there was nothing there to decode. A capture
with RDS actually present is the difference between testing a decoder and
testing an antenna.

The station name and the identifier are the useful assertions. An identifier is
constant for a station, so one that changes between runs is the signature of a
decoder reading noise through valid-looking syndromes rather than decoding.
"""

[capture.expect]
pi = 0x2208
station_name = "SPIRIT"
radiotext_contains = "Spirit"
group_yield_min_pct = 60.0

[[capture]]
name = "adsb_1090M_2400k.cu8"
sha256 = "fc3821a72532469b2ef001daf324b2492786467a164144f7aa5491e4b65fdb58"
url = "https://nostr.download/fc3821a72532469b2ef001daf324b2492786467a164144f7aa5491e4b65fdb58.xz"
compression = "xz"
center_hz = 1_090_000_000
rate_sps = 2_400_000
format = "cu8"
description = """
Four seconds of 1090 MHz, RTL-SDR at 49.6 dB gain on a telescopic antenna
indoors, so the aircraft are the loud ones and the rest of the band is noise.
That is the useful property: a Mode S demodulator that only works on strong
signals looks fine on a clean capture, and this one has marginal frames in it.

Not cut to its bursts, unlike most of the corpus, and deliberately so. 1090
MHz is dense with Mode A/C replies as well as Mode S, so an energy cut keeps
27% of the file at best, and cutting closer manufactured a frame dump1090
never saw: a Mode S preamble made out of a splice between two bursts. The
reference decode also comes from dump1090 run over the whole file, and there
is no dump1090 here to regenerate it with.

The reference decode in adsb_1090M_2400k.dump1090.hex comes from dump1090-rb
1.0.15 run over this exact file, so agreement is evidence from an independent
implementation rather than a restatement of our own assumptions. It finds 40
distinct frames; the tests require most of those and, more importantly, no
frame that dump1090 did not also see.
"""

[capture.expect]
reference = "adsb_1090M_2400k.dump1090.hex"
reference_frames = 40
matched_min = 25
false_positives = 0
icao = 0x4b1880

[[capture]]
name = "m17_openrtx_434.02M_2400k.cu8"
sha256 = "37e304fe3bb526c96c9a6148814c02350d346307d0722b88719701e5639daf6a"
url = "https://nostr.download/37e304fe3bb526c96c9a6148814c02350d346307d0722b88719701e5639daf6a.xz"
compression = "xz"
center_hz = 434_020_000
rate_sps = 2_400_000
format = "cu8"
description = """
Three seconds of 433 MHz ISM with one M17 transmission in it, from an OpenRTX
handheld on the 433.475 MHz calling channel. HackRF One, tuned 550 kHz above
the channel so the transmission is nowhere near the centre and nothing about
its position is convenient.

This is here because the receiver failed on it while the operator watched. The
band is busy: sensors, remotes and a wideband burst that crosses the M17
channel, and the auto node found the transmission, cut it out, and read nothing
from it. Three separate faults had to be fixed before it decoded, and every one
of them was invisible on synthesised M17, which is measured wide enough to
avoid all three. A capture of the real thing on a real band is the only test
that would have caught them.

The callsign is the assertion worth making. It is carried in the link setup
frame at the start of the transmission and repeated across the link information
channel, so reading it back means the demodulator, the framing, the Golay and
the CRC all worked on a signal nobody synthesised.
"""

[capture.expect]
protocol = "M17"
from = "OPNRTX"
to = "BROADCAST"
channel_hz = 433_475_000
frames_min = 20

[[capture]]
name = "tetra_downlink_391.5M_2400k.cu8"
sha256 = "db00a32871adb721fa84ebb1b23d2f803068de5ab9534371e7438d090018d2cd"
url = "https://nostr.download/db00a32871adb721fa84ebb1b23d2f803068de5ab9534371e7438d090018d2cd.xz"
compression = "xz"
center_hz = 391_500_000
rate_sps = 2_400_000
format = "cu8"
description = """
Eight seconds of the TETRA downlink band, HackRF One at 52 dB of tuner gain,
holding two base station carriers: 391.181 MHz and 391.7045 MHz, both about 16
kHz wide and both transmitting for every frame of the capture. Measured with an
independent FFT rather than by this code, they sit 30 to 33 dB over the median
noise across the span, which is far more than any threshold in the receiver
asks for.

The receiver reports neither. That is what the capture is evidence of: the
source detector estimates its noise floor as a per-bin sliding minimum over
`floor_memory_s`, so a carrier that never stops becomes its own floor and its
SNR reads zero. Here the carriers are already on when the capture starts, so
they are in the floor before the detector has ever seen those bins empty and
they are never reported at all. The synthesised equivalent passes, because the
test that covers a continuous carrier runs one shorter than the memory.

Nothing decodes TETRA, so the assertion is detection and only detection: a
source opened within half a channel of each carrier. If a later change makes
the receiver report a third carrier here, check it against the spectrum before
assuming a regression; the band has weaker traffic in it that comes and goes.

Recorded 2026-09-03 near the receiver in docs/design.md, DC blocker on, at a
gain chosen so the peak sits 20 dB below full scale with no clipping. An
earlier attempt at the default 32 dB put the carriers at under one ADC code
and is not what is uploaded here.

What is uploaded is seconds 4 to 12 of a twelve second recording, cut with
`cargo run -p sources --bin iq_clipper -- <file> <out> --skip 4 --seconds 8`. The
window is not arbitrary and is worth leaving alone: the group addresses below
arrive late, so a cut ending before eight seconds has no call rows in it at
all, and the sync and network broadcast are each expected exactly once across
the two halves the test replays, which a different split does not give.
"""

[capture.expect]
carrier_hz = [391_181_000, 391_704_500]
tolerance_hz = 12_500
snr_min_db = 20
always_on = true

[[capture]]
name = "dmr_tg9_433.45M_2048k.cu8"
sha256 = "800f4371a08cc940b40c10fc10f1373c7eff226f90246facc3eeac750ddc96f3"
url = "https://nostr.download/800f4371a08cc940b40c10fc10f1373c7eff226f90246facc3eeac750ddc96f3.xz"
compression = "xz"
center_hz = 433_450_000
rate_sps = 2_048_000
format = "cu8"
description = """
One DMR transmission on 433.900 MHz, 450 kHz up in a span tuned to 433.45,
recorded off air from a hotspot on an RTL-SDR. Three voice LC headers, ten
voice superframes and a terminator: 3.6 seconds of speech to talkgroup 9 from
radio ID 1234567.

The transmission's own signalling is what says so, and it says it four ways
that have to agree: the link control arrives in the header under
BPTC(196,96), again in the terminator, and again in each superframe as four
embedded fragments under BPTC(128,72) with a five-bit checksum over the nine
bytes. Six of the ten superframes decode their embedded copy independently
and all of them read the same talkgroup and radio ID as the headers.

What the capture is evidence of is the matched filter. DMR shapes its 4-FSK
with a root raised cosine at 0.2, and a receiver that reads the discriminator
without matching it still finds every sync word, because the sync words use
only the outer two of the four levels. The inner levels never separate: on
this capture every BPTC in the file failed with nine bad rows out of nine, so
the receiver knew a transmission was there and could say nothing about it,
and the call list stayed empty while the packet log filled with anonymous
rows. With the filter the same bursts decode clean.

It is also evidence about framing. Only burst A of a superframe carries a
sync, so a framer that hunts for one per superframe loses 360 ms whenever one
is marginal, and the silence timeout then closes the over: this transmission
arrived as three separate rows in the packet log before the burst clock
replaced the hunt.

Beware the polarity. MS_voice and MS_data are exact complements of each
other, so the sync alone cannot say which is which, and reading this capture
the wrong way up turns a voice call into signalling that never decodes.
"""

[capture.expect]
channel_hz = 433_900_000
talkgroup = 9
radio_id = 1_234_567
call_type = "group"
overs = 1
seconds_min = 3.0

[[capture]]
name = "odid_holybro_2431M_20000k.cs8"
sha256 = "599fa5231b16844230c6589462dbb13254ed6e8050fec0a7a77b4101a937f287"
url = "https://nostr.download/599fa5231b16844230c6589462dbb13254ed6e8050fec0a7a77b4101a937f287.xz"
compression = "xz"
center_hz = 2_431_000_000
rate_sps = 20_000_000
format = "cs8"
description = """
Open Drone ID over Bluetooth legacy advertising, from a Holybro RemoteID
module (an ESP32 running ArduRemoteID) on an S500 airframe, on a bench with no
GPS fix and no flight controller attached. HackRF at 20 MS/s tuned to 2431 MHz,
which puts advertising channel 38 inside the span and the tuner's DC spike well
away from it. Six seconds of the band held 78 advertisements that passed the
link layer's CRC-24, 28 of them from the module.

Cut down from the 234 MB recording to the bursts themselves by
`crates/nodes/examples/odid_probe.rs`, which keeps 2 ms either side of each
packet so the level gate still has a floor to measure against. All 28 packets
come back out of the cut, and the file is a fiftieth of the size.

The evidence is the transmitter's, twice over: every packet passed a CRC-24
this project did not compute the input to, and the message layout is ASTM
F3411 as `opendroneid/opendroneid-core-c` implements it. What the module is
saying is its shipped configuration rather than anything set for the test, so
the expectations below are deliberately thin: the UAS ID, the ID type, the
aircraft type, and that a location message arrives with its position marked
absent. It has no fix, so it says so, and a decoder that reports a position
here has invented one.

Do not key an expectation on the Bluetooth address. It is a random address and
it rotated between two recordings ten minutes apart; the UAS ID is what
identifies the aircraft.
"""

[capture.expect]
channel = 38
packets_min = 20
uas_id = "123"
id_type = "utm uuid"
ua_type = "aeroplane"
position_reported = false

[[capture]]
name = "odid_bt5lr_holybro_2474M_20000k.cs8"
sha256 = "aa0167c38ac118a852ea37682234a35c51f37b167d124a91c968fce10ab202f0"
url = "https://nostr.download/aa0167c38ac118a852ea37682234a35c51f37b167d124a91c968fce10ab202f0.xz"
compression = "xz"
center_hz = 2_474_000_000
rate_sps = 20_000_000
format = "cs8"
description = """
Open Drone ID over Bluetooth 5 Long Range, from the same Holybro RemoteID
module as odid_holybro_2431M_20000k.cs8 and on the same bench. HackRF at
20 MS/s tuned to 2474 MHz, which covers advertising channel 39 and data
channels 30 to 36.

What is in it is the auxiliary half of extended advertising. On the primary
channel the module sends an ADV_EXT_IND carrying no payload at all, only a
pointer to a data channel chosen afresh each time; over 46 seconds those
pointers named 24 different channels, so a span covering seven of the 37
catches roughly a fifth of them. The packets kept here are the auxiliary ones
themselves, eleven AUX_ADV_IND at S=8 on channels 31 to 36, each carrying a
whole ASTM F3411 message pack: basic id, location, self id and operator id in
one reception rather than four.

Cut from the 1.8 GB recording by `crates/nodes/examples/odid_probe.rs` with
ODID_DATA=1 and ODID_ONLY_LR=1, which keeps the long range packets and drops
the two hundred legacy advertisements alongside them. 329 times smaller, and
all eleven come back out of the cut.

The evidence is the link layer's CRC-24, computed over a body this project
did not construct, behind a convolutional code whose Viterbi survivor has to
be right for the CRC to pass at all. What the module says inside is its
shipped configuration, so the expectations are thin on purpose; see the
legacy capture's entry for why.

This capture is also what fixes a size: an uncoded advertisement is at most
376 us but a message pack at S=8 is about 8.5 ms, and a burst cap of 4 ms cut
every one of them short while the tiny pointers on the primary channel still
decoded. A receiver that reads the primary channel and reports nothing from
the auxiliary one is showing that symptom.
"""

[capture.expect]
packs_min = 8
messages_per_pack = 4
coding = "S8"
data_channels = [31, 32, 33, 34, 35, 36]
uas_id = "123"

[[capture]]
name = "pal_camera_5865M_20000k.cs8"
sha256 = "48d6f54d511185ac827cb242aa98efb11618205cf0f17899b12b603344d64b59"
url = "https://nostr.download/48d6f54d511185ac827cb242aa98efb11618205cf0f17899b12b603344d64b59.xz"
compression = "xz"
center_hz = 5_865_000_000
rate_sps = 20_000_000
format = "cs8"
description = """
Analogue video: an AKK RaceRunner transmitting a PAL camera on 5865 MHz,
which the 5.8 GHz channel plan names A1 or B8 because two bands share that
frequency.
HackRF at 20 MS/s, 240 ms cut out of a 3.6 second recording, holding six
fields of which three carry all 288 lines. The camera is looking at a room
with a window, so the picture has both a saturated highlight and dark
corners, and the colour subcarrier is carrying real chroma rather than a test
pattern.

What the capture is evidence of is that the whole chain works on real RF, and
what it fixed is more useful than what it confirmed:

A discriminator on a 20 MHz span gives a video baseband carrying all of that
bandwidth's noise while the picture occupies 5 MHz of it. Slicing that
unfiltered finds no sync at all, because a single noisy sample above the
threshold ends a run that has to last 4.7 us. This capture produced zero
fields until a quarter-microsecond running mean went in front of the slicer.

The colour subcarrier has to free-run rather than restart each line. Sync
edges land on whole samples, and at 20 MS/s one sample is 80 degrees of a
4.43 MHz subcarrier, so a per-line phase origin rotates the hue nearly a full
turn from line to line. With a continuous phase the burst holds steady near
-80 degrees, drifting a few degrees over a field, which is the tuner's own
offset.

Blanking is the 13th percentile of the sorted samples, not the 30th. A line
is 7.3% sync and another 11% porches, so taking it higher reads picture as
black level: a full-scale ramp came back peaking at 61%.

Also worth recording because it contradicts what the datasheets suggest: the
occupied bandwidth is about 4.6 MHz with roughly 1 MHz rms deviation, not the
20 to 30 MHz the manuals imply, so a 20 MS/s span is not clipping this
transmitter at all. Audio is present on a 6.5 MHz subcarrier and is not
decoded.
"""

[capture.expect]
standard = "PAL"
fields_min = 4
full_lines_min = 250
colour = true
channel = "A1 or B8"

[[capture]]
name = "droneid_mini4k_2444.5M_15360k.cs8"
sha256 = "626b82be90c7f1bc56c7f4dd8fba925c54e757a4d9571ab41a8fd023a569c109"
url = "https://nostr.download/626b82be90c7f1bc56c7f4dd8fba925c54e757a4d9571ab41a8fd023a569c109.xz"
compression = "xz"
center_hz = 2_444_500_000
rate_sps = 15_360_000
format = "cs8"
description = """
DJI DroneID from a DJI Mini 4K on the bench, powered up indoors with no GNSS
fix and no controller linked. Recorded with a LimeSDR at 61.44 MS/s centred on
2442 MHz, which covers the whole 2.4 GHz band, then tuned to 2444.5 MHz and
decimated to the 15.36 MS/s the frame is defined at and cut to its bursts:

    iq_clipper capture_2442.0000M_61440k.cs16 droneid_mini4k_2444.5M_15360k.cs8 \\
        --center-hz 2444500000 --rate 15360000 --bursts --min-us 600 \\
        --margin-ms 1.5 --threshold-db 14

Five thousand times smaller than the recording, and unlike every other capture
here it is not the same samples: it has been mixed, filtered and resampled, so
it is evidence about one 10 MHz channel rather than about the band. The
untuned recording holds the same bursts at 4.1 to 11.8 seconds, 639 ms apart,
alongside the Wi-Fi that made cutting it any other way pointless.

What makes it evidence: every frame carries a CRC-16 over 89 bytes, inside a
code block whose own CRC-24 also checks, neither of which this project
constructed, and the serial number they carry is the one printed on the
airframe. The aircraft was indoors, so it reports no position at all, which is
the correct behaviour and is asserted below: an aircraft with no fix sends
zeros and a decoder that turns those into a position off Africa has invented
evidence.

Thirteen bursts correlate in the recording and seven decode to this packet
type. The rest are the other packet type DJI sends interleaved with it, whose
layout differs and which is not read yet.
"""

[capture.expect]
frames = 7
serial = "F8PJC254J001JR4R"
sequence_first = 437
sequence_last = 444
position_reported = false
