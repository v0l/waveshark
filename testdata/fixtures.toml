license = "CC-BY-4.0"
description = """
Not IQ and not off the air: 36 seconds of Robot 36 audio generated by
pySSTV from a picture whose every pixel is known. The top half is the
colour bars in the usual order, white, yellow, cyan, green, magenta, red,
blue; the bottom half is a red-to-green ramp at constant blue.

It is here because Robot 36 is the mode with somewhere to go wrong. It
sends one colour difference a line, R-Y on the even lines and B-Y on the
odd, so each line has to borrow the other half from its neighbour, and
getting the pair the wrong way round gives a picture that still looks like
a picture. Two bugs did exactly that: the differences were swapped, and an
even line borrowed from the line before it rather than the one after. On a
photograph the result is plausible; on the bars, cyan disappears.

pySSTV is an independent implementation of the transmitter, so the check is
between two projects and a known input rather than against this decoder's
own assumptions. A synthesised signal proves the geometry and the colour and
nothing about reception: for that there is still no Robot 36 recording in
this corpus.
"""

