description = """
LTE band 28 downlink, a continuous cell rather than a burst. Real-part
kurtosis 3.30 and a cyclic-prefix peak of 1.23 to 1.28 at the LTE symbol
period. Weaker and less clean than the Wi-Fi capture, which is why both are
here: one OFDM signal is not evidence that a model learned OFDM.

Three quarters of a second of an eight second recording. The cell transmits
throughout, so the windows the classifier scores are slices of the same thing
and more of them add little; six is what this length gives, and at half a
second it falls to three, which is too few to mean much.

Recorded on a LimeSDR-USB, RX2/LNAL.

The carrier is EARFCN 9260, 763 MHz, 10 MHz wide, with two cells on it from
one site at the same timing: PCI 473 and PCI 481, both two antenna ports. Each
MIB passes its CRC-16 under the two-port mask, and each SIB1 is found by a
DCI whose CRC-16 is masked with the SI-RNTI and read from a transport block
whose CRC-24 checks, none of which this project computed. The SIB1s name
PLMN 272-03, tracking area 40111, band 28, and cells 72 and 73 of eNodeB
44338; 272-03 is Eir, to which ComReg's licence register assigns 758 to
768 MHz.

srsRAN 4G 25.10.0 (bef8680) read the same two SIB1s, byte for byte, off the
capture mixed down 1 MHz and resampled to 15.36 MS/s cf32:

    pdsch_ue -i lte_763M_15360k.cf32 -O 133450 -n 600 -p 50 -P 2 -Q \
        -r 0xffff -u <udp port> -c 473
    pdsch_ue ... -c 481 -R average

It decodes 30 of 30 SI-RNTI blocks of PCI 473, and 11 of 29 of PCI 481 with
its averaging channel estimator and none with its default one: the two cells
overlap at nearly the same strength.
"""

