description = """
The same band as screen_1080p60_595M_20000k.cs16, at the same dial, the same
span and the same gain, three minutes later with the screen's HDMI output
switched off. Everything else in the room stayed where it was, so what is
missing from this one is the screen and nothing else.

It is the negative the other capture needs. A decoder that reads a raster out
of this is reading the receiver, the band or itself: there is no line period
to find here at all, where the other gives 67.501 kHz at a score of 733.
"""

[[capture]]
name = "screen_744M_20000k.cs8"
sha256 = "caa413329bad3a9e128dbda5dcd1929335e23639a2ede8c5e967041837123c87"
url = "https://nostr.download/caa413329bad3a9e128dbda5dcd1929335e23639a2ede8c5e967041837123c87.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
A 1920x1080 60 Hz screen on HDMI, heard at 744 MHz, near 742.5 MHz, which is
the fifth harmonic of its 148.5 MHz pixel clock. Written by the receiver's own
raw span capture on 2026-09-27 and cut to its first 1.2 s. The screen's
picture may be recoverable from it.

It is evidence about throughput, not about reading. The scanner table puts
the screen decoder on 742.5 MHz here. In auto it searches once a second and
never locks, and each search once took 25 ms of a 6.5 ms block. Named
1920x1080 60 Hz it locks on the carrier, and a drift correction that pulled
the frame start back used to wrap round and finish a frame a few dozen
samples long, which then asked for the same correction again. That was
thousands of frames a block and seconds a block, and it stopped the whole
receiver.
"""

[[capture]]
name = "zigbee_join_ch11_2405M_8000k.cs8"
sha256 = "45afc3336a1515dcb3a6c35effa4f78b624273d51147940c10a11a9ec177ca8f"
url = "https://nostr.download/45afc3336a1515dcb3a6c35effa4f78b624273d51147940c10a11a9ec177ca8f.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
A Zigbee device joining a home network on channel 11, off air. Recorded with a
HackRF at 20 MS/s on 2410 MHz while the coordinator had permit join open, then
cut to 0.6 s and tuned to channel 11 at 8 MS/s with iq_clipper. This is one
channel, not the band.

The window holds two beacon requests from the joining device, six beacons in
answer (four from two routers of this network and two from a neighbour's), the
association request from 94:A0:81:FF:FE:86:DD:48 to router 0x0897, the
router's association response, and the network traffic around it: 31 frames,
every one with a good frame check.

Each frame was dissected by Wireshark 4.4.18 through rawshark, and the counts
the test asserts are what it reported. Our own decode agrees with it frame by frame,
including the network layer and the EUI-64 of each hop's sender.

The coordinator sends the network key to a joining device inside a key
transport command encrypted with the default link key, which anybody can
undo. Those frames are outside this window and nothing in it is readable with
the default link key; the network payloads stay encrypted.

Identities in it: the EUI-64s of the devices on this network, the extended PAN
ID of this network (41:0E:3A:D6:A1:CF:ED:BD) and of a neighbour's
(F1:4F:EF:31:2C:69:DE:F7).
"""

