[[capture]]
name = "dvbt_hd_429M_9142857.cs8"
sha256 = "0347bb58cc331f4a6b23d89de15c6aff4b6a8b0fb223c68af8a949e87c7af61e"
url = "https://nostr.download/0347bb58cc331f4a6b23d89de15c6aff4b6a8b0fb223c68af8a949e87c7af61e.xz"
compression = "xz"
license = "unstated"
license_source = "Ron Economos, w6rz.net/adv16.cfile, cut and requantised and re-hosted"
description = """
A DVB-T multiplex in 8K mode: 16-QAM, code rate 2/3, guard interval 1/32, at
the standard's own 64/7 megasamples a second. It carries one service of high
definition MPEG-2 video and AC-3 audio.

This is the test vector Ron Economos published at https://www.w6rz.net/adv16.cfile
for gnuradio's own DVB-T receiver, which its `gr-dtv/examples/dvbt_rx_8k.grc`
flow graph reads. It earns its place by coming from somebody else's modulator:
a loopback against our own transmitter proves the two halves agree with each
other and nothing about whether either agrees with the standard.

Cut from the original 934 MB file: 8,000,000 samples from 400 MB in, which is
0.875 seconds. The offset is not arbitrary. This stream sends a sequence
header about once a second, and without one nothing can be decoded at all: no
picture size, no quantiser matrices. A window from the start of the file locks
the receiver and reads the transport stream perfectly and cannot make a
picture, which is a decoder test that tests nothing.

Quantised from the original 32-bit floats to 8 bits, scaled so the largest
sample reaches 127, which clips nothing and costs no packets: the whole cut
reads with no Reed-Solomon corrections at either depth.
"""

[[capture]]
name = "screen_1080p60_595M_20000k.cs16"
sha256 = "6b333bc10f2fea68d60dd72b5990ee57e936263a3f8a18e54e0c06f17dc5c55b"
url = "https://nostr.download/6b333bc10f2fea68d60dd72b5990ee57e936263a3f8a18e54e0c06f17dc5c55b.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
The unintentional emissions of a monitor's cable, at 595 MHz, which is the
fourth harmonic of the 148.5 MHz pixel clock a 1920x1080 screen at 60 Hz is
driven with. Written by the receiver's own raw span capture off a LimeSDR-USB
on 2026-09-24 and cut to 0.6 s, 36 frames.

Which screen is not inferred, it was switched: the transmitter is a
Mediatrix MPI7002 panel on a Raspberry Pi, and turning its HDMI output off
takes the 67.501 kHz line away entirely while everything else about the
receiver stays where it was. See screen_off_595M_20000k.cs16, recorded three
minutes later at the same dial and gain, which is that same band with the
output off.

What the capture is evidence of is the half of the measurement a real screen
can withhold. The line period is exact: 67.501 kHz against the mode's own
67.500. The frame is not there at all, because this screen carries its
picture weakly at the fourth harmonic and what survives is the blanking, so
the strongest line count in the 49 to 87 Hz range stands about 2 sigma above
the other 601, which is what the largest of 601 draws of noise does by
itself. A synthesised screen of the same mode stands 18.1 sigma over the same
field.

So the receiver refuses it in auto and reads it when the mode is named: told
1920x1080 60 Hz it measures 60.0007 Hz from the line period alone, seven
parts in a million from the mode's own rate, and 27 of its 30 frames land
where that period says they will. The picture that comes out is the raster's
blanking, a bright band 12.7% of the line wide and 4% of the frame tall,
which is 280 pixels of 2200 and 45 lines of 1125. Before the field was
measured this way the same capture locked at 833, 1112 and 1291 lines on
successive tries, all at that one correct line rate, and painted a picture
that rolled.
"""

