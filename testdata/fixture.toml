reference_url = "https://nostr.download/828edd77556b0738af2c90ffac0e56e5714154dc88e0426a4f80d6cfa929cdbd.txt"
description = """
Four seconds of 1090 MHz, RTL-SDR at 49.6 dB gain on a telescopic antenna
indoors, so the aircraft are the loud ones and the rest of the band is noise.
That is the useful property: a Mode S demodulator that only works on strong
signals looks fine on a clean capture, and this one has marginal frames in it.

Not cut to its bursts, unlike most of the corpus, and deliberately so. 1090
MHz is dense with Mode A/C replies as well as Mode S, so an energy cut keeps
27% of the file at best, and cutting closer manufactured a frame dump1090
never saw: a Mode S preamble made out of a splice between two bursts. The
reference decode also comes from dump1090 run over the whole file, and there
is no dump1090 here to regenerate it with.

The reference decode in adsb_1090M_2400k.dump1090.hex comes from dump1090-rb
1.0.15 run over this exact file, so agreement is evidence from an independent
implementation rather than a restatement of our own assumptions. It finds 40
distinct frames; the tests require most of those and, more importantly, no
frame that dump1090 did not also see.
"""

[[capture]]
name = "adsb_radarpi_1090M_2400k.cu8"
sha256 = "f4b197f408b1f2173b044f92ac26ccba4c5ee3a73dd092758e097ddcf789feb4"
url = "https://nostr.download/f4b197f408b1f2173b044f92ac26ccba4c5ee3a73dd092758e097ddcf789feb4.xz"
compression = "xz"
license = "CC-BY-4.0"
reference_name = "adsb_radarpi_1090M_2400k.dump1090.ts"
reference_sha256 = "58d86d96cb01de453c0919c253b1480e3b5730d893621428657d1d4d2324d207"
reference_url = "https://nostr.download/58d86d96cb01de453c0919c253b1480e3b5730d893621428657d1d4d2324d207.txt"
description = """
Ten seconds of 1090 MHz off radarpi, a Nooelec FlyCatcher on an outdoor
antenna at 49.6 dB, recorded by rtl_sdr straight to file at Dublin approach
in daylight. Dense: 53 aircraft and 4091 frames by dump1090's count, against
40 frames in the whole of adsb_1090M_2400k.cu8. Uncut, for the reason that
file gives, and because an energy cut is meaningless on a band this busy.

What this one is for is the clock. The reference beside it is not a list of
frames but dump1090's own Beast timestamps, one frame a line as ticks and
hex, which is what makes a timestamp checkable here at all: the older
reference carries hex alone, so nothing in the corpus could say whether a
frame was timed right. Matching frames by payload and removing the constant
offset between the two receivers, the residual is 0.91 ticks RMS, 76 ns,
spread over four buckets from -1 to +2. A decoder that quantises to a whole
sample cannot reach that: a sample is five ticks at this rate.

It is also the evidence for what the two decoders each read. dump1090-rb
1.0.15 read 4091 frames to this receiver's 3722, ahead on DF17, 1013 to 1109,
and behind on the replies that overlay their address on the parity, DF20 514
to 341 and DF21 472 to 341, which is issue #159. Of the frames it read and
this did not, 302 of 306 name an aircraft already proved here by a clean
DF17 or DF11, so they were never demodulated rather than rejected.

The all-call replies are why it is here at all: 825 of dump1090's 1181 DF11
answer a ground station and leave that station's id over the parity rather
than zero. Reading only the zero ones left this receiver with 411 of them and
cost it mlat sync on radarpi.
"""

[[capture]]
name = "tetra_downlink_391.5M_2400k.cu8"
sha256 = "db00a32871adb721fa84ebb1b23d2f803068de5ab9534371e7438d090018d2cd"
url = "https://nostr.download/db00a32871adb721fa84ebb1b23d2f803068de5ab9534371e7438d090018d2cd.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
Eight seconds of the TETRA downlink band, HackRF One at 52 dB of tuner gain,
holding two base station carriers: 391.181 MHz and 391.7045 MHz, both about 16
kHz wide and both transmitting for every frame of the capture. Measured with an
independent FFT rather than by this code, they sit 30 to 33 dB over the median
noise across the span, which is far more than any threshold in the receiver
asks for.

The receiver reports neither. That is what the capture is evidence of: the
source detector estimates its noise floor as a per-bin sliding minimum over
`floor_memory_s`, so a carrier that never stops becomes its own floor and its
SNR reads zero. Here the carriers are already on when the capture starts, so
they are in the floor before the detector has ever seen those bins empty and
they are never reported at all. The synthesised equivalent passes, because the
test that covers a continuous carrier runs one shorter than the memory.

Nothing decodes TETRA, so the assertion is detection and only detection: a
source opened within half a channel of each carrier. If a later change makes
the receiver report a third carrier here, check it against the spectrum before
assuming a regression; the band has weaker traffic in it that comes and goes.

Recorded 2026-09-03 on an RTL-SDR, DC blocker on, at a
gain chosen so the peak sits 20 dB below full scale with no clipping. An
earlier attempt at the default 32 dB put the carriers at under one ADC code
and is not what is uploaded here.

What is uploaded is seconds 4 to 12 of a twelve second recording, cut with
`cargo run -p sources --example iq_clipper -- <file> <out> --skip 4 --seconds 8`. The
window is not arbitrary and is worth leaving alone: the group addresses the test
asserts arrive late, so a cut ending before eight seconds has no call rows in it at
all, and the sync and network broadcast are each expected exactly once across
the two halves the test replays, which a different split does not give.
"""

[[capture]]
name = "dmr_tg9_433.45M_2048k.cu8"
sha256 = "800f4371a08cc940b40c10fc10f1373c7eff226f90246facc3eeac750ddc96f3"
url = "https://nostr.download/800f4371a08cc940b40c10fc10f1373c7eff226f90246facc3eeac750ddc96f3.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
One DMR transmission on 433.900 MHz, 450 kHz up in a span tuned to 433.45,
recorded off air from a hotspot on an RTL-SDR. Three voice LC headers, ten
voice superframes and a terminator: 3.6 seconds of speech to talkgroup 9 from
radio ID 1234567.

The transmission's own signalling is what says so, and it says it four ways
that have to agree: the link control arrives in the header under
BPTC(196,96), again in the terminator, and again in each superframe as four
embedded fragments under BPTC(128,72) with a five-bit checksum over the nine
bytes. Six of the ten superframes decode their embedded copy independently
and all of them read the same talkgroup and radio ID as the headers.

What the capture is evidence of is the matched filter. DMR shapes its 4-FSK
with a root raised cosine at 0.2, and a receiver that reads the discriminator
without matching it still finds every sync word, because the sync words use
only the outer two of the four levels. The inner levels never separate: on
this capture every BPTC in the file failed with nine bad rows out of nine, so
the receiver knew a transmission was there and could say nothing about it,
and the call list stayed empty while the packet log filled with anonymous
rows. With the filter the same bursts decode clean.

It is also evidence about framing. Only burst A of a superframe carries a
sync, so a framer that hunts for one per superframe loses 360 ms whenever one
is marginal, and the silence timeout then closes the over: this transmission
arrived as three separate rows in the packet log before the burst clock
replaced the hunt.

Beware the polarity. MS_voice and MS_data are exact complements of each
other, so the sync alone cannot say which is which, and reading this capture
the wrong way up turns a voice call into signalling that never decodes.
"""

[[capture]]
name = "odid_holybro_2431M_20000k.cs8"
sha256 = "599fa5231b16844230c6589462dbb13254ed6e8050fec0a7a77b4101a937f287"
