# Captures from rtl_433's own test corpus, with the output rtl_433 produces
# for each one.
#
# https://github.com/merbanan/rtl_433_tests, pinned to a commit so the bytes
# behind a URL cannot change under the expected decodes. Fetched by
# testdata/fetch.sh, into testdata/rtl433/, and never committed: the corpus is
# a gigabyte of contributed recordings under no stated licence, so this project
# points at it rather than copying it.
#
# Each entry names a .cu8 and the .json beside it. The JSON is the reference:
# one line per decode rtl_433 25.02 found in that capture, which
# crates/decode/tests/rtl433_corpus.rs compares against field by field.
#
# The local name is not the upstream one. Half the corpus predates rtl_433
# putting the frequency and sample rate in the filename, and `sources::FileSource`
# needs the rate: guessing it wrong rescales every pulse and breaks every
# decoder downstream in a way that looks like a protocol bug.

