[[capture]]
name = "gfsk_ble_2426M_20000k.cs8"
sha256 = "76e9ad30ef850287433d3a8aef472cb066c7f9eb6d5cecf5be0de8fec42d96fb"
url = "https://nostr.download/76e9ad30ef850287433d3a8aef472cb066c7f9eb6d5cecf5be0de8fec42d96fb.xz"
compression = "xz"
center_hz = 2_426_000_000
rate_sps = 20_000_000
format = "cs8"
family = "msk_gmsk"
receiver = "HackRF One, 2.4 GHz whip"
burst_us = [80, 500]
description = """
Bluetooth Low Energy advertising on channel 38, two seconds at twenty
megasamples.

This replaces a four megasample capture of the same signal, and the reason is
worth keeping. BLE is one megabit per second, so four megasamples is four
samples a symbol, and at that spacing the per-sample frequency noise is larger
than the deviation being measured: the symbol rate came out at 82 kbaud
against a true 1000, the tone separation at 365 kHz against 500, and the
modulation index at 1.25 where GFSK is 0.5. Every classifier read it as
amplitude keying, and the fault was the sampling rather than the classifier.

The same signal at twenty megasamples measures 996 kbaud, 467 kHz and h =
0.47, and is read as MSK. A capture rate that is fine for seeing a signal is
not automatically fine for measuring one, and an evaluation set that does not
distinguish those two tests the recording instead of the code.
"""

