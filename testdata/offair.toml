# Off-air captures recorded for the signal identification model.
#
# Same arrangement as fixtures.toml and for the same reason: IQ is close to
# incompressible and committing it would bloat history permanently. Fetch with
# ./testdata/fetch.sh, into testdata/offair/.
#
# Each is stored at the resolution its radio actually has, cs8 for the HackRF's
# eight-bit ADC and cs16 for the LimeSDR's twelve, rather than as the float the
# recorder wrote. That is three times smaller for no lost information: the
# HackRF files round-trip to the recorded floats exactly.
#
# `family` is the label, and it is only ever what the capture demonstrates. See
# crates/decode/tests/classify_offair.rs for why an unverified label is worse
# than none.

