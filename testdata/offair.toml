description = """
Meshtastic LongFast on the EU868 plan: LoRa at spreading factor 11 over 250
kHz, one 641 ms packet from a node in the same building. The parameters are
known rather than inferred, because the transmitter was configured by hand, and
a dechirp against SF11/BW250 returns a peak-to-mean of 3319 where noise gives
