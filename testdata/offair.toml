[[capture]]
name = "ofdm_wifi_frames_2462M_20000k.cs8"
# The excerpts are four milliseconds apart, so the two millisecond default
# bridge glues neighbours together and forty-one frames arrive as two.
bridge_us = 200
sha256 = "9c97b3237f69ff5b8289571d77c2e9e8288efc71a9acf4fa635ab49dee6e132d"
url = "https://nostr.download/9c97b3237f69ff5b8289571d77c2e9e8288efc71a9acf4fa635ab49dee6e132d.xz"
compression = "xz"
center_hz = 2_462_000_000
rate_sps = 20_000_000
format = "cs8"
family = "ofdm"
receiver = "HackRF One, 2.4 GHz whip"
burst_us = [20, 500]
occupancy_min = 0.25
description = """
Forty-one verified 802.11 OFDM frames, each with four milliseconds of the
recording around it, cut from fifteen seconds at 2462 MHz and concatenated.

Curated rather than continuous, and that is the point: in fifteen seconds of a
busy channel only forty-one frames are OFDM. The rest is Bluetooth hopping
through the band and 802.11b beacons at the 1 Mbps basic rate, which arrive
every 102.4 ms because that is the beacon interval. A continuous recording
labelled `ofdm` is therefore mostly not OFDM, and the first model trained
against one scored 2 percent on it while being right about what the windows
actually held.

Selection is by occupied bandwidth, not duration: the Bluetooth bursts overlap
802.11 frames in length and never in bandwidth, 1 MHz against 16.

The 802.11 front end reads 94 frames off this file, not 41: the four
milliseconds kept around each selected frame hold acknowledgements and data
frames of their own, three of the transmissions are 802.11n aggregates
holding a QoS data frame each, and the rest are 802.11b at 1 Mbit/s. Every
one of the 94 passes its FCS, so the
count is evidence about the receiver rather than a threshold, and `radio.rs`
asserts it.
"""

[[capture]]
name = "ofdm_wifi_2462M_20000k.cs8"
# Only the short frames carry the label. This capture also holds 3.4 ms bursts
# that are constant envelope and unidentified, and they outweigh the OFDM by
# time on air seventy to one.
burst_us = [20, 200]
# and must fill at least half the span, which is what separates an 802.11
# frame from a Bluetooth hop of the same length in the same recording.
occupancy_min = 0.25
sha256 = "ebbf4a5b2c91eeb2fd819676fa7878f632ef050a546e75e52495c1c9683ee684"
url = "https://nostr.download/ebbf4a5b2c91eeb2fd819676fa7878f632ef050a546e75e52495c1c9683ee684.xz"
compression = "xz"
center_hz = 2_462_000_000
rate_sps = 20_000_000
format = "cs8"
family = "mixed"
receiver = "HackRF One, 2.4 GHz whip"
# Not scored: `family` is deliberately not a family. See below.
description = """
Not an evaluation capture. This is three systems sharing a channel, and no
single label is true of it: Bluetooth hopping through the band, 802.11b
beacons at the 1 Mbps basic rate every 102.4 ms, and the occasional OFDM
frame. It was labelled `ofdm` when it was recorded and that was simply wrong,
which cost a model 2 percent on the one family it did know and cost an
afternoon finding out why. The forty-one verified frames were cut out of a
longer recording into their own file; this one is kept for the open-set case
and for the beacons, and scored against nothing.

802.11 on channel 11. Three seconds holding 49 bursts were recorded; what is
uploaded is the first half second of that, cut to its twenty bursts with 2 ms
either side, which is a seventh of the original and still holds both kinds and
five beacon intervals. The 51 us bursts are
OFDM and say so twice over: Gaussian sample statistics (real-part kurtosis 3.1
to 3.25) and a cyclic-prefix correlation peak of 1.37 to 1.48 at the 802.11
symbol of 4 us with an 0.8 us guard.

The longer bursts in the same file, around 3.4 ms and 9.4 MHz wide, are
802.11b beacons at 1 Mbit/s after all. The phase-step histogram that argued
against it was measured on the raw samples rather than on the despread ones:
a Barker-spread signal steps phase at 11 Mchip/s, and only after despreading
does the one step per microsecond that carries the bit appear. The receiver
reads them, and `radio.rs` asserts the network name and the access point they
carry. What was right in the original note is that they are not what the
`ofdm` label meant.
"""

