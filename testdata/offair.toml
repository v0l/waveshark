Energy detection never found this. LoRa is built to decode below the noise
floor and the excursion inside the LoRa bandwidth stayed under 10 dB, so two
earlier capture sessions were written off as empty until the detector was
rewritten to dechirp and then validated against a synthetic chirp buried at
-10 dB SNR.
"""

