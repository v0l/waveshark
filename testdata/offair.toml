# Off-air captures recorded for the signal identification model.
#
# Same arrangement as fixtures.toml and for the same reason: IQ is close to
# incompressible and committing it would bloat history permanently. Fetch with
# ./testdata/fetch.sh, into testdata/offair/.
#
# Each is stored at the resolution its radio actually has, cs8 for the HackRF's
# eight-bit ADC and cs16 for the LimeSDR's twelve, rather than as the float the
# recorder wrote. That is three times smaller for no lost information: the
# HackRF files round-trip to the recorded floats exactly.
#
# `family` is the label, and it is only ever what the capture demonstrates. See
# crates/decode/tests/classify_offair.rs for why an unverified label is worse
# than none.
#
# Most of these are cut down from what the radio wrote, with
# `cargo run --release -p sources --example cut`: to the bursts themselves
# where the capture is packets, and to the first fraction of a second where it
# is something continuous. A recording is of a real band at a real place and
# time, and the parts no test looks at are the parts nobody has looked at, so
# they are not published. Each entry says what was kept and why that much.
#
# Two things a cut does not remove, and they are properties of these captures
# rather than accidents. `meshcore_advert` decodes to a node named "Kieran" and
# its position, and `gfsk_ble` carries the hardware addresses of whatever was
# advertising in the room, one of which crates/app's survey test asserts by
# name along with the receiver's own coordinates. Both are what makes them
# evidence; treat them as published, not as private data that happens to be in
# a test fixture.

