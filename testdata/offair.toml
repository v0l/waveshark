description = """
Impulsive interference in the UHF television band, kept deliberately as a
negative. It was recorded expecting a DVB-T multiplex and is not one: real-part
kurtosis is 13.5 where OFDM sits near 3, and there is no cyclic-prefix
structure at any DVB-T mode or guard interval.

A classifier that has never been shown broadband noise with structure in it
will confidently call this something.

A quarter second of the two that were recorded. Not cut to its bursts: the
quiet between the impulses is half of what a detector has to not fire on, so
the whole window is kept and only its length is reduced.
"""

