# Captures whose reading is written here rather than in a test.
#
# crates/app/src/corpus.rs replays each one through the whole receiver under
# the shipped scanner table and checks every [[capture.read]] against the rows
# that came out. A capture another test needs for something else can still be
# here; what the receiver reads off it is pinned in this file and nowhere else.
#
# Fetched by ./testdata/fetch.sh. `name` is the path under testdata/.

[[capture]]
name = "fineoffset_wh1080_433.92M_250k.cu8"
sha256 = "5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19"
url = "https://nostr.download/5d54aea229037bafe7f8aa1bffeb90fd938632cb5c289f2846b9491cc0ac3f19.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
Fine Offset WH1080 weather station, OOK PWM at 433.92 MHz. Captured on an
RTL-SDR with an R820T tuner at 49.6 dB gain. Contains one complete
transmission. Independently decoded by rtl_433 25.02, which is what makes it
useful: the expected values below come from a different implementation, so a
decoder agreeing with them is real evidence rather than a restatement of our
own assumptions.
"""

rows = 1

[[capture.read]]
protocol = "ism"
kind = "Fineoffset-WHx080"
rows = 1
checked = true
modulation = "OOK"
hz = 433_920_000
hz_within = 10_000
snr_min_db = 6.0
sensed = { temperature = 16.2, humidity = 89, "wind direction" = 180, "wind speed" = 0.0, "wind gust" = 0.0, rainfall = 84.3 }

[[capture]]
name = "m17_openrtx_434.02M_2400k.cu8"
sha256 = "37e304fe3bb526c96c9a6148814c02350d346307d0722b88719701e5639daf6a"
url = "https://nostr.download/37e304fe3bb526c96c9a6148814c02350d346307d0722b88719701e5639daf6a.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
Three seconds of 433 MHz ISM with one M17 transmission in it, from an OpenRTX
handheld on the 433.475 MHz calling channel. HackRF One, tuned 550 kHz above
the channel so the transmission is nowhere near the centre and nothing about
its position is convenient.

This is here because the receiver failed on it while the operator watched. The
band is busy: sensors, remotes and a wideband burst that crosses the M17
channel, and the auto node found the transmission, cut it out, and read nothing
from it. Three separate faults had to be fixed before it decoded, and every one
of them was invisible on synthesised M17, which is measured wide enough to
avoid all three. A capture of the real thing on a real band is the only test
that would have caught them.

The callsign is the assertion worth making. It is carried in the link setup
frame at the start of the transmission and repeated across the link information
channel, so reading it back means the demodulator, the framing, the Golay and
the CRC all worked on a signal nobody synthesised.
"""

[[capture.read]]
protocol = "m17"
rows = 49
from = ["OPNRTX"]
to = ["BROADCAST"]
hz = 433_475_000
hz_within = 10_000

[[capture.read]]
protocol = "m17"
kind = "voice"
rows = 48

