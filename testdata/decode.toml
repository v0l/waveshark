compression = "xz"
license = "CC-BY-4.0"
description = """
Not an evaluation capture. This is three systems sharing a channel, and no
single label is true of it: Bluetooth hopping through the band, 802.11b
beacons at the 1 Mbps basic rate every 102.4 ms, and the occasional OFDM
frame. It was labelled `ofdm` when it was recorded and that was simply wrong,
which cost a model 2 percent on the one family it did know and cost an
afternoon finding out why. The forty-one verified frames were cut out of a
longer recording into their own file; this one is kept for the open-set case
and for the beacons, and scored against nothing.

802.11 on channel 11. Three seconds holding 49 bursts were recorded; what is
uploaded is the first half second of that, cut to its twenty bursts with 2 ms
either side, which is a seventh of the original and still holds both kinds and
five beacon intervals. The 51 us bursts are
OFDM and say so twice over: Gaussian sample statistics (real-part kurtosis 3.1
to 3.25) and a cyclic-prefix correlation peak of 1.37 to 1.48 at the 802.11
symbol of 4 us with an 0.8 us guard.

The longer bursts in the same file, around 3.4 ms and 9.4 MHz wide, are
802.11b beacons at 1 Mbit/s after all. The phase-step histogram that argued
against it was measured on the raw samples rather than on the despread ones:
a Barker-spread signal steps phase at 11 Mchip/s, and only after despreading
does the one step per microsecond that carries the bit appear. The receiver
reads them, and names the network they carry. What was right in the original note is that they are not what the
`ofdm` label meant.

Recorded on a HackRF One, 2.4 GHz whip.
