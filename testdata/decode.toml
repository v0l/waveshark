url = "https://nostr.download/3caaac9675213a9defab1b4bdbb3c22dce209affd0c8c1b60d5c6f2c1d5d4d35.xz"
compression = "xz"
license = "CC-BY-4.0"
description = """
44 seconds of both AIS channels from the Waal at Nijmegen, written by the
receiver's own raw span capture off a LimeSDR-USB on 2026-09-23. It holds the
MMSIs and positions of the barges passing the city that afternoon.

The level is the point of it. The samples spread over about half a
least significant bit, four distinct byte values in the first 200 000, so
every frame is read out of what is nearly a one-bit stream. Uncut, because a
cut on energy found 4 to 34 bursts depending on its threshold, and each cut
changed what both decoders read.

Independently read by gnuais 0.3.3, fed each channel's discriminator
through scipy: 12 frames passed their CRC, from 244690403, 205581490,
244133678, 244670443, 244013030 and 211664370. This receiver reads 24, 11 on
channel A and 13 on B, from nine vessels. Eleven of gnuais's twelve are among
them; the one missed is 244133678's binary broadcast.

It first read five, and none with the DC block on. Its channel filter passed
everything that did not alias, so the discriminator heard about three times
the channel's bandwidth of noise, and the dedupe took a frame on one channel
for a copy of one heard on the other.
"""

[[capture.read]]
protocol = "ais"
rows = 24

