[[capture]]
name = "rs41_herstmonceux_405.80024M_31.25k.cs16"
sha256 = "56c441feb1ea430e3bdb80ed69e4a2d1e92565403bebf8c8813abee651696a30"
url = "https://nostr.download/56c441feb1ea430e3bdb80ed69e4a2d1e92565403bebf8c8813abee651696a30.xz"
compression = "xz"
license = "unstated"
license_source = "SDRangel, sdrangel.org/iq-files radiosonde.zip, cut and converted and re-hosted"
description = """
Vaisala RS41 radiosonde S1720982, recorded 2022-02-15 at 13:23 UTC near
London and published by SDRangel as its radiosonde example
(https://www.sdrangel.org/iq-files/, radiosonde.zip). The first 40 seconds of
that recording, converted from the WAV's data chunk without resampling or
retuning; the centre here is the one the recorder wrote into the file's auxi
chunk. The sonde sits 9.76 kHz above it.

It is over Sussex at 10.3 km climbing at 5 to 7 m/s, which puts its launch at
Herstmonceux for the 12 UTC sounding about an hour earlier. SDRangel's own
radiosonde demodulator reads this file, which is what the serial and the
telemetry are checked against.

What it demonstrates that a synthesised signal does not, and what it was kept
at 40 seconds and at its original centre for, is everything between the
antenna and the decoder. The transmission is only 4 dB over the floor, so the
detector opens it late and measures its centre a few kilohertz differently
every second; the 10 kHz raster on the band is what turns those into one
channel rather than forty. The sonde is off centre by two thirds of the span,
which is what caught a remembered channel being dropped for not fitting
inside it. And the duty cycle is real: 534 ms of carrier a second, so the
decoder has to survive the gaps.

The receiver reads 28 of the 40 transmissions. The first seven go to
finding it: a channel is not remembered until a frame has decoded on it, and
until then every burst is a fresh decoder that started after the header had
already gone by.
"""

[[capture.read]]
protocol = "rs41"
rows = 28
checked = true
modulation = "2-FSK"
subjects = ["S1720982"]
hz = 405_810_000

