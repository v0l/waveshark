[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/mbe",
    "crates/dsp",
    "crates/nodes",
    "crates/pipeline",
    "crates/hackrf",
    "crates/rtlsdr-sys",
    "crates/rtlsdr",
    "crates/limesdr-sys",
    "crates/limesdr",
    "crates/iqnet",
    "crates/sources",
    "crates/decode",
    "crates/datasets",
    "crates/app",
    "crates/audio",
]

# The MBE vocoder port is opt-in only: its algorithms carry patent
# restrictions, so nothing builds or links it by default.
# `cargo test -p mbe` builds and tests it explicitly.
default-members = [
    "crates/common",
    "crates/dsp",
    "crates/nodes",
    "crates/pipeline",
    "crates/hackrf",
    "crates/rtlsdr-sys",
    "crates/rtlsdr",
    "crates/limesdr-sys",
    "crates/limesdr",
    "crates/iqnet",
    "crates/sources",
    "crates/decode",
    "crates/datasets",
    "crates/app",
    "crates/audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# `common` rather than `core`: a workspace crate named `core` collides with the
# Rust sysroot crate and makes every `use core::..` path ambiguous.
common = { path = "crates/common" }
dsp = { path = "crates/dsp" }
pipeline = { path = "crates/pipeline" }
nodes = { path = "crates/nodes" }
audio = { path = "crates/audio" }
hackrf = { path = "crates/hackrf" }
rtlsdr = { path = "crates/rtlsdr" }
rtlsdr-sys = { path = "crates/rtlsdr-sys" }
limesdr = { path = "crates/limesdr" }
limesdr-sys = { path = "crates/limesdr-sys" }
iqnet = { path = "crates/iqnet" }
sources = { path = "crates/sources" }
decode = { path = "crates/decode" }
datasets = { path = "crates/datasets" }

anyhow = "1.0"
thiserror = "2.0"
num-complex = "0.4"
rustfft = "6.4"
rayon = "1.12"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
nusb = "0.2"
bindgen = "0.72"
pkg-config = "0.3"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
poll-promise = { version = "0.3", features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds still need usable DSP throughput.
[profile.dev.package."*"]
opt-level = 3

# The glob above covers dependencies only, so the workspace crates on the
# signal path have to be named. Without this the test suite runs the
# channelizer, the detectors and the slicers unoptimised: replaying the rtl_433
# corpus took 75 seconds that way and takes 4 with them optimised.
[profile.dev.package.common]
opt-level = 3
[profile.dev.package.dsp]
opt-level = 3
[profile.dev.package.decode]
opt-level = 3
[profile.dev.package.nodes]
opt-level = 3
[profile.dev.package.sources]
opt-level = 3

# Test binaries carry the corpus replay itself, which is the same arithmetic
# over again.
[profile.test]
opt-level = 3
