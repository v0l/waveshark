[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/mbe",
    "crates/dsp",
    "crates/nodes",
    "crates/pipeline",
    "crates/hackrf",
    "crates/hackrf-usb",
    "crates/rtlsdr-sys",
    "crates/rtlsdr",
    "crates/limesdr-sys",
    "crates/limesdr",
    "crates/iqstream",
    "crates/remote",
    "crates/sources",
    "crates/decode",
    "crates/datasets",
    "crates/app",
    "crates/audio",
    "crates/gps",
    "crates/survey",
    "crates/httpc",
    "crates/orbit",
    "crates/stt",
    "crates/stt-cuda",
    "crates/tts",
    "crates/hfmodel",
]

# The MBE vocoder port is opt-in only: its algorithms carry patent
# restrictions, so nothing builds or links it by default.
# `cargo test -p mbe` builds and tests it explicitly.
# `stt` builds by default with the app, which turns its feature on: a receiver
# that cannot say what was said on a voice channel is missing the point of
# one. `cargo build -p app --no-default-features` leaves candle out.
default-members = [
    "crates/common",
    "crates/dsp",
    "crates/nodes",
    "crates/pipeline",
    "crates/hackrf",
    "crates/hackrf-usb",
    "crates/rtlsdr-sys",
    "crates/rtlsdr",
    "crates/limesdr-sys",
    "crates/limesdr",
    "crates/iqstream",
    "crates/remote",
    "crates/sources",
    "crates/decode",
    "crates/datasets",
    "crates/app",
    "crates/audio",
    "crates/gps",
    "crates/survey",
    "crates/httpc",
    "crates/orbit",
    "crates/stt",
    "crates/tts",
    "crates/hfmodel",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Calendars are not worth writing twice: the civil-from-days arithmetic was
# hand-rolled in three places. `std` and no clock, because everything here
# formats a timestamp somebody else measured.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `common` rather than `core`: a workspace crate named `core` collides with the
# Rust sysroot crate and makes every `use core::..` path ambiguous.
common = { path = "crates/common" }
stt = { path = "crates/stt", default-features = false }
tts = { path = "crates/tts", default-features = false }
hfmodel = { path = "crates/hfmodel" }
dsp = { path = "crates/dsp" }
pipeline = { path = "crates/pipeline" }
nodes = { path = "crates/nodes" }
audio = { path = "crates/audio" }
hackrf = { path = "crates/hackrf" }
hackrf-usb = { path = "crates/hackrf-usb" }
rtlsdr = { path = "crates/rtlsdr" }
rtlsdr-sys = { path = "crates/rtlsdr-sys" }
limesdr = { path = "crates/limesdr" }
limesdr-sys = { path = "crates/limesdr-sys" }
remote = { path = "crates/remote" }
sources = { path = "crates/sources" }
decode = { path = "crates/decode" }
datasets = { path = "crates/datasets" }
mbe = { path = "crates/mbe" }
gps = { path = "crates/gps" }
survey = { path = "crates/survey" }
httpc = { path = "crates/httpc" }
orbit = { path = "crates/orbit" }
iqstream = { path = "crates/iqstream" }

anyhow = "1.0"
# Raw ffmpeg, for the container and the codecs a broadcast multiplex uses.
ffmpeg-rs-raw = "1.0"
thiserror = "2.0"
num-complex = "0.4"
rustfft = "6.4"
rayon = "1.12"
wide = "1.7"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
# Bundled so a build needs no system SQLite. The Artemis signal database
# is read through it; map marker history is meant to be stored through it.
rusqlite = { version = "0.40", features = ["bundled"] }
nusb = "0.2"
bindgen = "0.72"
pkg-config = "0.3"
# Mesh protocol ciphers: Meshtastic encrypts in AES-128-CTR and MeshCore in
# AES-128-ECB with a truncated HMAC-SHA256 tag. Audited implementations rather
# than hand-written ones, even though this only ever decrypts public broadcast
# traffic under published keys.
aes = "0.9"
ctr = "0.10"
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
# One client for the whole program, built through `httpc` so every request
# carries the same user agent. rustls rather than the system OpenSSL, so a
# release binary runs on a machine that has neither.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
    "multipart",
] }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
poll-promise = { version = "0.3", features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The interface crate is fifty thousand lines in one compilation unit, and
# one unit is one thread: a one line change to a pane took over a minute of
# which most was a single core finishing the binary. Sixteen units cost a
# little speed in code that is not on the signal path (the DSP crates keep
# their single unit) and give the change back in build time.
[profile.release.package.app]
codegen-units = 16

# A profile for running the receiver while working on it: no link time
# optimisation and a unit per thread everywhere, which is another ten
# seconds off a rebuild at a few per cent of throughput. `cargo run
# --profile quick`. Releases are built with `--release`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16

# Debug builds still need usable DSP throughput.
[profile.dev.package."*"]
opt-level = 3

# The glob above covers dependencies only, so the workspace crates on the
# signal path have to be named. Without this the test suite runs the
# channelizer, the detectors and the slicers unoptimised: replaying the rtl_433
# corpus took 75 seconds that way and takes 4 with them optimised.
[profile.dev.package.common]
opt-level = 3
[profile.dev.package.dsp]
opt-level = 3
[profile.dev.package.decode]
opt-level = 3
[profile.dev.package.nodes]
opt-level = 3
[profile.dev.package.sources]
opt-level = 3

# Test binaries carry the corpus replay itself, which is the same arithmetic
# over again.
[profile.test]
opt-level = 3

# candle links the CUDA libraries: libcudart and libcublas end up in the
# binary's import table, so the loader resolves them before main runs and a
# build with CUDA in it does not start on a machine with no NVIDIA runtime.
# This fork changes two lines, cudarc's linking feature and the runtime the
# compiled kernels link against, so both are loaded at run time instead. One
# build then serves every machine: with no card, candle reports no CUDA device
# and the speech models run on the CPU.
[patch.crates-io]
candle-core = { git = "https://github.com/v0l/candle", rev = "a3ebb4c8a5ba28e9bed8f2cda65621c467398d36" }
candle-kernels = { git = "https://github.com/v0l/candle", rev = "a3ebb4c8a5ba28e9bed8f2cda65621c467398d36" }
candle-nn = { git = "https://github.com/v0l/candle", rev = "a3ebb4c8a5ba28e9bed8f2cda65621c467398d36" }
candle-transformers = { git = "https://github.com/v0l/candle", rev = "a3ebb4c8a5ba28e9bed8f2cda65621c467398d36" }
