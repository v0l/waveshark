[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/dsp",
    "crates/nodes",
    "crates/pipeline",
    "crates/hackrf",
    "crates/rtlsdr-sys",
    "crates/rtlsdr",
    "crates/sources",
    "crates/decode",
    "crates/app",
    "crates/audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# `common` rather than `core`: a workspace crate named `core` collides with the
# Rust sysroot crate and makes every `use core::..` path ambiguous.
common = { path = "crates/common" }
dsp = { path = "crates/dsp" }
pipeline = { path = "crates/pipeline" }
nodes = { path = "crates/nodes" }
audio = { path = "crates/audio" }
hackrf = { path = "crates/hackrf" }
rtlsdr = { path = "crates/rtlsdr" }
rtlsdr-sys = { path = "crates/rtlsdr-sys" }
sources = { path = "crates/sources" }
decode = { path = "crates/decode" }

anyhow = "1.0"
thiserror = "2.0"
num-complex = "0.4"
rustfft = "6.4"
rayon = "1.12"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
nusb = "0.2"
bindgen = "0.72"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds still need usable DSP throughput.
[profile.dev.package."*"]
opt-level = 3
